name: Add Home Conversation Tabs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch HomePage tabs
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')
          original = text

          if 'String get selectedChatTab' not in text:
              text = text.replace(
                  "  bool loading = true;\n\n  Future<void> load() async {",
                  "  bool loading = true;\n  int selectedTab = 0;\n\n  String get selectedChatTab => const ['all', 'direct', 'group', 'channel'][selectedTab];\n\n  List<Map<String, dynamic>> get filteredChats {\n    if (selectedChatTab == 'all') return chats;\n    return chats.where((c) => '${c['type'] ?? ''}' == selectedChatTab).toList();\n  }\n\n  Future<void> load() async {",
              )

          body_pattern = re.compile(
              r"      body: loading\n          \? const Center\(child: CircularProgressIndicator\(\)\)\n          : chats\.isEmpty\n              \? Center\(.*?\n      floatingActionButton:",
              re.S,
          )

          new_body = '''      body: loading
          ? const Center(child: CircularProgressIndicator())
          : Column(
              children: [
                const SizedBox(height: 6),
                SingleChildScrollView(
                  scrollDirection: Axis.horizontal,
                  padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 4),
                  child: Row(
                    children: [
                      _homeTab(0, 'همه', Icons.chat_bubble_outline),
                      _homeTab(1, 'شخصی', Icons.person_outline),
                      _homeTab(2, 'گروه', Icons.groups_outlined),
                      _homeTab(3, 'کانال', Icons.campaign_outlined),
                    ],
                  ),
                ),
                const Divider(height: 1),
                Expanded(
                  child: selectedChatTab == 'channel'
                      ? Center(
                          child: Padding(
                            padding: const EdgeInsets.all(28),
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Icon(Icons.campaign_outlined, size: 64, color: Theme.of(context).colorScheme.primary),
                                const SizedBox(height: 16),
                                const Text('هنوز کانالی ندارید', style: TextStyle(fontSize: 20, fontWeight: FontWeight.w800)),
                                const SizedBox(height: 8),
                                const Text('بخش کانال اضافه شده است؛ ساخت کانال را در مرحله بعد فعال می‌کنیم.', textAlign: TextAlign.center),
                              ],
                            ),
                          ),
                        )
                      : filteredChats.isEmpty
                          ? Center(
                              child: Padding(
                                padding: const EdgeInsets.all(32),
                                child: Column(
                                  mainAxisAlignment: MainAxisAlignment.center,
                                  children: [
                                    Container(
                                      width: 88,
                                      height: 88,
                                      decoration: BoxDecoration(
                                        color: Theme.of(context).colorScheme.primaryContainer,
                                        shape: BoxShape.circle,
                                      ),
                                      child: Icon(Icons.forum_outlined, size: 42, color: Theme.of(context).colorScheme.primary),
                                    ),
                                    const SizedBox(height: 20),
                                    Text(
                                      selectedChatTab == 'all' ? 'هنوز گفتگویی ندارید' : selectedChatTab == 'direct' ? 'هنوز گفتگوی شخصی ندارید' : 'هنوز گروهی ندارید',
                                      style: const TextStyle(fontSize: 20, fontWeight: FontWeight.w800),
                                    ),
                                    const SizedBox(height: 8),
                                    const Text('با پیدا کردن یک کاربر، اولین گفتگوی خود را شروع کنید.', textAlign: TextAlign.center),
                                    const SizedBox(height: 20),
                                    FilledButton.icon(
                                      onPressed: createDirect,
                                      icon: const Icon(Icons.add_comment_outlined),
                                      label: const Text('شروع گفتگوی جدید'),
                                    ),
                                  ],
                                ),
                              ),
                            )
                          : ListView.builder(
                              itemCount: filteredChats.length,
                              itemBuilder: (context, i) {
                                final c = filteredChats[i];
                                final title = '${c['title'] ?? (c['type'] == 'group' ? 'گروه' : c['type'] == 'channel' ? 'کانال' : 'گفتگو')}';
                                return ListTile(
                                  leading: CircleAvatar(child: Icon(c['type'] == 'group' ? Icons.groups : c['type'] == 'channel' ? Icons.campaign : Icons.person)),
                                  title: Text(title),
                                  subtitle: Text('${c['last_message'] ?? ''}'),
                                  onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => ChatPage(id: '${c['id']}', title: title))),
                                );
                              },
                            ),
                ),
              ],
            ),
      floatingActionButton:'''

          match = body_pattern.search(text)
          if not match:
              raise SystemExit('HomePage body pattern not found')
          text = text[:match.start()] + new_body + text[match.end():]

          marker = "  Future<void> createDirect() async {"
          if '_homeTab(int index' not in text:
              helper = '''  Widget _homeTab(int index, String label, IconData icon) {
    final active = selectedTab == index;
    return Padding(
      padding: const EdgeInsets.symmetric(horizontal: 4),
      child: InkWell(
        borderRadius: BorderRadius.circular(24),
        onTap: () => setState(() => selectedTab = index),
        child: AnimatedContainer(
          duration: const Duration(milliseconds: 180),
          padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 10),
          decoration: BoxDecoration(
            color: active ? Theme.of(context).colorScheme.primary : Colors.transparent,
            borderRadius: BorderRadius.circular(24),
          ),
          child: Row(
            mainAxisSize: MainAxisSize.min,
            children: [
              Icon(icon, size: 19, color: active ? Colors.white : Theme.of(context).colorScheme.onSurfaceVariant),
              const SizedBox(width: 7),
              Text(label, style: TextStyle(fontWeight: FontWeight.w800, color: active ? Colors.white : Theme.of(context).colorScheme.onSurfaceVariant)),
            ],
          ),
        ),
      ),
    );
  }

'''
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')
          if text != original:
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add','lib/main.dart'], check=True)
              subprocess.run(['git','commit','-m','feat: add personal group and channel tabs'], check=True)
              subprocess.run(['git','push'], check=True)
          else:
              print('No changes required')
