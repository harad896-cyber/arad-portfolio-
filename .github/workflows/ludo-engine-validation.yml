name: Ludo Engine, Lobby and Invite Validation

on:
  push:
    branches: [feature/gapresan-dice-prototype]
    paths:
      - 'lib/ludo_engine.dart'
      - 'lib/ludo_xp_service.dart'
      - 'lib/ludo_character_editor.dart'
      - 'lib/ludo_customization.dart'
      - 'lib/ludo_lobby.dart'
      - 'lib/main.dart'
      - 'supabase/migrations/*ludo*.sql'
      - 'supabase/seed/ludo_items.json'
      - 'supabase/tests/ludo_progression_contract.sql'
      - 'test/ludo_engine_test.dart'
      - 'test/ludo_xp_service_test.dart'
      - 'test/ludo_character_editor_test.dart'
      - 'test/ludo_customization_test.dart'
      - '.github/workflows/ludo-engine-validation.yml'
  pull_request:
    paths:
      - 'supabase/seed/ludo_items.json'
      - 'supabase/tests/ludo_progression_contract.sql'
      - 'lib/ludo_engine.dart'
      - 'lib/ludo_xp_service.dart'
      - 'lib/ludo_lobby.dart'
      - 'lib/main.dart'
      - 'supabase/migrations/*ludo*.sql'
      - 'test/ludo_engine_test.dart'
      - 'test/ludo_xp_service_test.dart'
      - '.github/workflows/ludo-engine-validation.yml'
  workflow_dispatch:

concurrency:
  group: ludo-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ludo-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format engine and tests
        run: dart format lib/ludo_engine.dart lib/ludo_xp_service.dart lib/ludo_lobby.dart lib/ludo_character_editor.dart lib/ludo_customization.dart lib/main.dart test/ludo_engine_test.dart test/ludo_xp_service_test.dart test/ludo_character_editor_test.dart test/ludo_customization_test.dart
      - name: Analyze engine, lobby and tests
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/ludo_engine.dart lib/ludo_xp_service.dart lib/ludo_lobby.dart lib/ludo_character_editor.dart lib/ludo_customization.dart lib/main.dart test/ludo_engine_test.dart test/ludo_xp_service_test.dart test/ludo_character_editor_test.dart test/ludo_customization_test.dart
      - name: Run Ludo engine unit and simulation tests
        run: flutter test test/ludo_engine_test.dart
      - name: Run Ludo cosmetic editor and customization tests
        run: flutter test test/ludo_character_editor_test.dart test/ludo_customization_test.dart
      - name: Run Ludo XP and level progression tests
        run: flutter test test/ludo_xp_service_test.dart
