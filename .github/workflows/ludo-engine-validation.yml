name: Ludo Engine Validation

on:
  push:
    branches: [feature/gapresan-dice-prototype]
    paths:
      - 'lib/ludo_engine.dart'
      - 'test/ludo_engine_test.dart'
      - '.github/workflows/ludo-engine-validation.yml'
  pull_request:
    paths:
      - 'lib/ludo_engine.dart'
      - 'test/ludo_engine_test.dart'
      - '.github/workflows/ludo-engine-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ludo-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format engine and tests
        run: dart format lib/ludo_engine.dart test/ludo_engine_test.dart
      - name: Analyze engine and tests
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/ludo_engine.dart test/ludo_engine_test.dart
      - name: Run Ludo engine unit and simulation tests
        run: flutter test test/ludo_engine_test.dart
