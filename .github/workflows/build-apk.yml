name: Build Android Test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.arad.messenger .

      - name: Install Arad Messenger app icon
        run: |
          find android/app/src/main/res -type f -name 'ic_launcher.*' -delete
          mkdir -p android/app/src/main/res/mipmap
          cp assets/app_icon.jpg android/app/src/main/res/mipmap/ic_launcher.jpg

      - name: Configure Google OAuth callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          activity = '<activity android:name=".MainActivity"'
          intent = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.arad.messenger" android:host="login-callback" />
              </intent-filter>
          '''
          if intent.strip() not in s:
              i = s.find(activity)
              end = s.find(">", i)
              if i == -1 or end == -1:
                  raise SystemExit("MainActivity declaration not found")
              close = s.find("</activity>", end)
              if close == -1:
                  raise SystemExit("MainActivity activity block not found")
              s = s[:close] + intent + s[close:]
              p.write_text(s)
          PY

      - name: Set app identity
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Arad Messenger"/' android/app/src/main/AndroidManifest.xml
          sed -i "s/applicationId = '[^']*'/applicationId = 'com.arad.messenger'/" android/app/build.gradle.kts || true
          sed -i 's/applicationId "[^"]*"/applicationId "com.arad.messenger"/' android/app/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build test APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            flutter build apk --debug --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          else
            echo "Google Client ID not configured; building email-auth test APK."
            flutter build apk --debug
          fi

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
