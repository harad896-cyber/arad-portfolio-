name: Build Android Test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.arad.messenger .

      - name: Install app icon
        run: |
          mkdir -p android/app/src/main/res/mipmap
          cp assets/app_icon.jpg android/app/src/main/res/mipmap/ic_launcher.jpg
          sed -i 's#@mipmap/ic_launcher#@mipmap/ic_launcher#' android/app/src/main/AndroidManifest.xml

      - name: Set app identity
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Arad Messenger"/' android/app/src/main/AndroidManifest.xml
          sed -i "s/applicationId = '[^']*'/applicationId = 'com.arad.messenger'/" android/app/build.gradle.kts || true
          sed -i 's/applicationId "[^"]*"/applicationId "com.arad.messenger"/' android/app/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build test APK
        run: flutter build apk --debug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
