name: Build Android Release APK
# Release build: fixed app identity and reproducible CI signing.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.arad.messenger .
          rm -rf test

      - name: Install Arad Messenger app icon
        if: ${{ hashFiles('assets/app_icon.jpg') != '' }}
        run: |
          find android/app/src/main/res -type f -name 'ic_launcher.*' -delete
          mkdir -p android/app/src/main/res/mipmap
          cp assets/app_icon.jpg android/app/src/main/res/mipmap/ic_launcher.jpg

      - name: Set app identity
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Arad Messenger"/' android/app/src/main/AndroidManifest.xml
          sed -i "s/applicationId = '[^']*'/applicationId = 'com.arad.messenger'/" android/app/build.gradle.kts || true
          sed -i 's/applicationId "[^"]*"/applicationId "com.arad.messenger"/' android/app/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            flutter build apk --release --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          else
            echo "Google Client ID not configured; building email-auth release APK."
            flutter build apk --release
          fi

      - name: Sign release APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "debug.keystore was not generated by Flutter; creating a temporary signing key."
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "${APK%.apk}-aligned.apk"
          mv "${APK%.apk}-aligned.apk" "$APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks android/app/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
