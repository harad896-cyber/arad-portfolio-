name: Chat Games SDK validation

on:
  push:
    branches: [feature/gapresan-chat-games]
    paths:
      - 'server/games/**'
      - '.github/workflows/chat-games-validation.yml'
  pull_request:
    paths:
      - 'server/games/**'
      - '.github/workflows/chat-games-validation.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SDK and XO unit tests
        run: node --test server/games/*.test.mjs
