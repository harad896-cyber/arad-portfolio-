name: Flutter Android validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/gapresan-fun-zone]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: dart format lib/main.dart lib/fun_zone.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
