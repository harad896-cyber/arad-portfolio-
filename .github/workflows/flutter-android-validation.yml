name: Flutter Android and Web validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/gapresan-fun-zone]

permissions:
  contents: write

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version

      # This repository currently generates its Android host on CI. Keep the
      # same TEST signing certificate across builds so Android can update an
      # installed GapResan test build instead of rejecting it as a signature mismatch.
      # This key is intentionally test-only; never use it for Play Store releases.
      - name: Generate Android platform files when missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.gapresan .
          fi
      - name: Install persistent GapResan test signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/keys/gapresan-test-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - run: flutter pub get
      - run: dart format lib/main.dart lib/fun_zone.dart lib/fun_game_engine.dart lib/fun_game_room_chat.dart lib/fun_game_voice_call.dart lib/chess_game.dart lib/chess_engine/chess.dart lib/chess_room_chat.dart lib/fun_zone_theme.dart lib/fun_game_leaderboard.dart lib/gap_coin_wallet.dart lib/ludo_game.dart lib/ludo_customization.dart test/widget_test.dart test/ludo_customization_test.dart test/chess_rules_test.dart test/fun_zone_theme_test.dart test/ludo_rules_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gapresan-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Build one universal APK. The same test key is reused on every CI run.
      - name: Build universal release APK
        run: flutter build apk --release
      - name: Verify APK archive, package ID, and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          # Re-sign the release output explicitly; Gradle's default debug config
          # may use a different keystore on the runner.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          unzip -t "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/gapresan-apk-badging.txt
          APP_ID="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" /tmp/gapresan-apk-badging.txt | head -n1)"
          test -n "$APP_ID"
          echo "Verified application ID: $APP_ID"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/gapresan-apk-signature.txt
          grep -qi "f676a6dd950c09ce54066fa7d06a4d83d51ae7d7891006d724e6b42f30d5263c" /tmp/gapresan-apk-signature.txt
          sha256sum "$APK" | tee "$APK.sha256"
          file "$APK"

      # A real Android emulator install/launch catches package/signature/startup
      # problems that static analysis and widget tests cannot detect.
      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          script: |
            set -eu
            APK="build/app/outputs/flutter-apk/app-release.apk"
            BUILD_TOOLS="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
            APP_ID="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)"
            adb install -r "$APK"
            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof "$APP_ID"
            if adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|Fatal signal"; then
              echo "Fatal Android crash detected during startup"
              exit 1
            fi

      # Publish only after analyzer, tests, archive/signature verification,
      # and a real emulator install/launch have all passed.
      - name: Publish direct-install APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/gapresan-fun-zone'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: gapresan-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: GapResan Android Test ${{ github.run_number }}
          body: |
            Project 2 / GapResan test build.
            Install the attached app-release.apk directly on Android. Do not extract it.
            Built from commit ${{ github.sha }} after Flutter analyze, tests, APK signature verification, and Android emulator launch test.
            This is a test build, not a production Play Store release.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256

      - run: flutter build web --release --base-href /
      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: gapresan-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 14
