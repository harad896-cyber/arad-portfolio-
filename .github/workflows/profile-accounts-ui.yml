name: Apply Profile And Account UI

on:
  push:
    paths:
      - 'tools/profile_accounts_ui_patch.py'
      - 'trigger-profile-accounts.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/profile_accounts_ui_patch.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git diff --cached --quiet || git commit -m 'feat: separate profile and working account controls'
          git push
