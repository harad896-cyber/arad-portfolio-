name: Enhance Arad Messenger - Fonts and Ranks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enhance-fonts-ranks.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Persian/Arabic fonts
        run: |
          mkdir -p assets/fonts
          curl -L --fail -o assets/fonts/Vazirmatn.ttf 'https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Regular.ttf'
          curl -L --fail -o assets/fonts/Sahel.ttf 'https://raw.githubusercontent.com/rastikerdar/sahel-font/master/dist/Sahel-VF.ttf'
          curl -L --fail -o assets/fonts/Shabnam.ttf 'https://raw.githubusercontent.com/rastikerdar/shabnam-font/master/dist/Shabnam.ttf'
          curl -L --fail -o assets/fonts/NotoSansArabic.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf'

      - name: Add fonts, font picker and rank system
        shell: python
        run: |
          from pathlib import Path

          main = Path('lib/main.dart')
          text = main.read_text(encoding='utf-8')

          if 'class FontSettingsPage extends StatefulWidget' not in text:
              marker = "final supabase = Supabase.instance.client;"
              addition = r'''

const Map<String, String> aradFonts = {
  'Vazirmatn': 'Vazirmatn',
  'Sahel': 'Sahel',
  'Shabnam': 'Shabnam',
  'Noto Sans Arabic': 'NotoSansArabic',
};

final ValueNotifier<String> appFontFamily = ValueNotifier<String>('Vazirmatn');

Future<void> loadAppFont() async {
  final p = await SharedPreferences.getInstance();
  appFontFamily.value = p.getString('app_font') ?? 'Vazirmatn';
}

Future<void> setAppFont(String family) async {
  appFontFamily.value = family;
  final p = await SharedPreferences.getInstance();
  await p.setString('app_font', family);
}

String rankForMessageCount(int count) {
  if (count >= 5000) return 'افسانه‌ای';
  if (count >= 2000) return 'استاد';
  if (count >= 1000) return 'الماس';
  if (count >= 500) return 'طلایی';
  if (count >= 200) return 'نقره‌ای';
  if (count >= 50) return 'برنزی';
  return 'تازه‌وارد';
}

String rankEmoji(String rank) {
  switch (rank) {
    case 'افسانه‌ای': return '👑';
    case 'استاد': return '🏆';
    case 'الماس': return '💎';
    case 'طلایی': return '🥇';
    case 'نقره‌ای': return '🥈';
    case 'برنزی': return '🥉';
    default: return '🌱';
  }
}

class FontSettingsPage extends StatefulWidget {
  const FontSettingsPage({super.key});
  @override
  State<FontSettingsPage> createState() => _FontSettingsPageState();
}

class _FontSettingsPageState extends State<FontSettingsPage> {
  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('فونت برنامه')),
      body: ValueListenableBuilder<String>(
        valueListenable: appFontFamily,
        builder: (context, selected, _) => ListView(
          padding: const EdgeInsets.all(20),
          children: [
            const Text('فونت مورد علاقه‌ات را انتخاب کن', style: TextStyle(fontSize: 18, fontWeight: FontWeight.w800)),
            const SizedBox(height: 8),
            const Text('انتخاب شما در برنامه ذخیره می‌شود.'),
            const SizedBox(height: 18),
            ...aradFonts.entries.map((entry) => Card(
              child: RadioListTile<String>(
                value: entry.value,
                groupValue: selected,
                title: Text(entry.key, style: TextStyle(fontFamily: entry.value, fontSize: 18, fontWeight: FontWeight.w700)),
                subtitle: Text('نمونه متن فارسی و English', style: TextStyle(fontFamily: entry.value, fontSize: 14)),
                onChanged: (value) async {
                  if (value == null) return;
                  await setAppFont(value);
                },
              ),
            )),
          ],
        ),
      ),
    );
  }
}

class RankPage extends StatelessWidget {
  const RankPage({super.key});

  Future<int> messageCount() async {
    final uid = supabase.auth.currentUser?.id;
    if (uid == null) return 0;
    try {
      final rows = await supabase.from('messages').select('id').eq('sender_id', uid);
      return (rows as List).length;
    } catch (_) {
      return 0;
    }
  }

  @override
  Widget build(BuildContext context) {
    const ranks = <Map<String, dynamic>>[
      {'name': 'تازه‌وارد', 'min': 0, 'emoji': '🌱'},
      {'name': 'برنزی', 'min': 50, 'emoji': '🥉'},
      {'name': 'نقره‌ای', 'min': 200, 'emoji': '🥈'},
      {'name': 'طلایی', 'min': 500, 'emoji': '🥇'},
      {'name': 'الماس', 'min': 1000, 'emoji': '💎'},
      {'name': 'استاد', 'min': 2000, 'emoji': '🏆'},
      {'name': 'افسانه‌ای', 'min': 5000, 'emoji': '👑'},
    ];
    return Scaffold(
      appBar: AppBar(title: const Text('رنک من')),
      body: FutureBuilder<int>(
        future: messageCount(),
        builder: (context, snapshot) {
          final count = snapshot.data ?? 0;
          final current = rankForMessageCount(count);
          return ListView(
            padding: const EdgeInsets.all(20),
            children: [
              Card(
                child: Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(children: [
                    Text(rankEmoji(current), style: const TextStyle(fontSize: 46)),
                    const SizedBox(height: 8),
                    Text(current, style: const TextStyle(fontSize: 24, fontWeight: FontWeight.w900)),
                    const SizedBox(height: 4),
                    Text('$count پیام ارسال‌شده'),
                  ]),
                ),
              ),
              const SizedBox(height: 12),
              ...ranks.map((r) => Card(
                child: ListTile(
                  leading: Text(r['emoji'] as String, style: const TextStyle(fontSize: 28)),
                  title: Text(r['name'] as String, style: const TextStyle(fontWeight: FontWeight.w800)),
                  subtitle: Text('از ${r['min']} پیام'),
                  trailing: current == r['name'] ? const Icon(Icons.check_circle, color: Colors.green) : null,
                ),
              )),
            ],
          );
        },
      ),
    );
  }
}
'''
              if marker not in text:
                  raise SystemExit('Supabase marker not found')
              text = text.replace(marker, marker + addition, 1)

          text = text.replace(
              "await Supabase.initialize(\n    url: supabaseUrl,\n    publishableKey: supabasePublishableKey,\n  );\n  runApp(const AradMessenger());",
              "await Supabase.initialize(\n    url: supabaseUrl,\n    publishableKey: supabasePublishableKey,\n  );\n  await loadAppFont();\n  runApp(const AradMessenger());",
              1,
          )

          text = text.replace(
              "return MaterialApp(\n      locale:",
              "return ValueListenableBuilder<String>(\n      valueListenable: appFontFamily,\n      builder: (context, font, _) => MaterialApp(\n      locale:",
              1,
          )
          text = text.replace(
              "theme: ThemeData(\n        useMaterial3: true,",
              "theme: ThemeData(\n        fontFamily: font,\n        useMaterial3: true,",
              1,
          )
          text = text.replace(
              "home: const AuthGate(),\n    );\n  }\n}",
              "home: const AuthGate(),\n      ),\n    );\n  }\n}",
              1,
          )

          # Add the customization menu to HomePage without touching other AppBars.
          if '// ARAD_UI_CUSTOMIZE' not in text:
              start = text.find('class _HomePageState')
              if start < 0:
                  raise SystemExit('HomePage state not found')
              end = text.find('\nclass ', start + 10)
              if end < 0:
                  end = len(text)
              section = text[start:end]
              pos = section.find('appBar: AppBar(')
              if pos < 0:
                  raise SystemExit('HomePage AppBar not found')
              abspos = start + pos
              insert_at = abspos + len('appBar: AppBar(')
              action = '''\n          // ARAD_UI_CUSTOMIZE\n          actions: [\n            IconButton(\n              tooltip: 'فونت و رنک',\n              icon: const Icon(Icons.auto_awesome),\n              onPressed: () {\n                showModalBottomSheet(\n                  context: context,\n                  showDragHandle: true,\n                  builder: (sheetContext) => SafeArea(\n                    child: Column(mainAxisSize: MainAxisSize.min, children: [\n                      ListTile(\n                        leading: const Icon(Icons.font_download_outlined),\n                        title: const Text('فونت برنامه'),\n                        onTap: () {\n                          Navigator.pop(sheetContext);\n                          Navigator.push(context, MaterialPageRoute(builder: (_) => const FontSettingsPage()));\n                        },\n                      ),\n                      ListTile(\n                        leading: const Icon(Icons.emoji_events_outlined),\n                        title: const Text('رنک من'),\n                        onTap: () {\n                          Navigator.pop(sheetContext);\n                          Navigator.push(context, MaterialPageRoute(builder: (_) => const RankPage()));\n                        },\n                      ),\n                    ]),\n                  ),\n                );\n              },\n            ),\n          ],\n'''
              text = text[:insert_at] + action + text[insert_at:]

          # Add a font shortcut to the onboarding profile screen.
          old_profile = "appBar: AppBar(title: const Text('پروفایل شما')),";
          new_profile = "appBar: AppBar(title: const Text('پروفایل شما'), actions: [IconButton(tooltip: 'فونت برنامه', icon: const Icon(Icons.font_download_outlined), onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const FontSettingsPage())))]), // ARAD_PROFILE_FONT"
          if old_profile in text and '// ARAD_PROFILE_FONT' not in text:
              text = text.replace(old_profile, new_profile, 1)

          main.write_text(text, encoding='utf-8')

          pub = Path('pubspec.yaml')
          ptext = pub.read_text(encoding='utf-8')
          old_flutter = "flutter:\n  uses-material-design: true\n"
          new_flutter = '''flutter:\n  uses-material-design: true\n  fonts:\n    - family: Vazirmatn\n      fonts:\n        - asset: assets/fonts/Vazirmatn.ttf\n    - family: Sahel\n      fonts:\n        - asset: assets/fonts/Sahel.ttf\n    - family: Shabnam\n      fonts:\n        - asset: assets/fonts/Shabnam.ttf\n    - family: NotoSansArabic\n      fonts:\n        - asset: assets/fonts/NotoSansArabic.ttf\n'''
          if 'assets/fonts/Vazirmatn.ttf' not in ptext:
              if old_flutter not in ptext:
                  raise SystemExit('pubspec flutter block not found')
              ptext = ptext.replace(old_flutter, new_flutter, 1)
              pub.write_text(ptext, encoding='utf-8')

          for token in ['class FontSettingsPage', 'class RankPage', 'fontFamily: font', 'ARAD_UI_CUSTOMIZE']:
              if token not in text:
                  raise SystemExit(f'missing expected change: {token}')
          print('enhancement source updated')

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart pubspec.yaml assets/fonts
          git diff --cached --quiet || git commit -m 'feat: add font chooser and user ranks'
          git push
