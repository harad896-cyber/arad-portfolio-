name: Group Chat Style APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Apply group chat design
        run: python3 tool/apply_group_chat_style.py
      - name: Commit group chat design
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git diff --cached --quiet || git commit -m 'feat: apply premium group chat design'
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true
      - name: Generate current Android wrapper
        run: |
          rm -rf android
          flutter create --platforms=android --org com.arad.messenger --project-name arad_messenger .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          if p.exists():
              s = p.read_text()
              import re
              s = re.sub(r'minSdk(?:Version)?\\s+flutter\.minSdkVersion', 'minSdk 24', s)
              s = re.sub(r'minSdk(?:Version)?\\s*=\\s*flutter\.minSdkVersion', 'minSdk = 24', s)
              p.write_text(s)
          PY
      - name: Build release APK
        run: flutter build apk --release --no-pub
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-group-chat-final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
