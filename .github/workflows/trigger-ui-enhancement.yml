name: Trigger UI Enhancement

on:
  push:
    paths:
      - 'trigger-ui-enhancements.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch enhancement workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run enhance-fonts-ranks.yml --ref main
