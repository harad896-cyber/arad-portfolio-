name: Apply delete-for-everyone fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply patches
        run: |
          python tools/fix_delete_for_everyone.py
          python tools/fix_chat_order.py

      - name: Verify patches
        run: |
          grep -q "loaded.removeWhere((m) => hidden.contains('\${m['id']}') || m['deleted_at'] != null);" lib/main.dart
          grep -q "پیام حذف نشد؛ مجوز حذف برای همه یا مالکیت پیام بررسی شود." lib/main.dart
          grep -q "order('created_at', ascending: true)" lib/main.dart
          grep -q "loaded.sort((a, b)" lib/main.dart
          grep -q "_messagesScroll.position.maxScrollExtent" lib/main.dart

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart tools/fix_delete_for_everyone.py tools/fix_chat_order.py .github/workflows/apply-delete-everyone-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce chronological chat message order"
          git push origin HEAD:main
