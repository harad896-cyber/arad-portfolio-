name: Apply messenger runtime fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply patches
        run: |
          python tools/fix_delete_for_everyone.py
          python tools/fix_chat_order.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(r"'\${Directory.systemTemp.path}/arad_voice_\${DateTime.now().millisecondsSinceEpoch}.m4a'", "'${Directory.systemTemp.path}/arad_voice_${DateTime.now().millisecondsSinceEpoch}.m4a'")
          s = s.replace(r"'\${widget.id}/voice_\${DateTime.now().millisecondsSinceEpoch}.m4a'", "'${widget.id}/voice_${DateTime.now().millisecondsSinceEpoch}.m4a'")
          s = s.replace("Row(children: List.generate(4, (i) {", "Row(children: List.generate(5, (i) {")
          s = s.replace("supabase.from('saved_messages').select('id, body, message_type, created_at').order('created_at', ascending: false)", "supabase.from('saved_messages').select('id, body, message_type, created_at').eq('user_id', supabase.auth.currentUser!.id).order('created_at', ascending: false)")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify patches
        run: |
          grep -q "order('created_at', ascending: true)" lib/main.dart
          grep -q "loaded.sort((a, b)" lib/main.dart
          grep -q "_messagesScroll.position.maxScrollExtent" lib/main.dart
          grep -q "Directory.systemTemp.path}/arad_voice_" lib/main.dart
          grep -q "widget.id}/voice_" lib/main.dart
          grep -q "List.generate(5, (i)" lib/main.dart

      - name: Commit and push repaired source
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart tools/fix_delete_for_everyone.py tools/fix_chat_order.py .github/workflows/apply-delete-everyone-fix.yml
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "fix: repair messenger voice and runtime features"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Final APK build is triggered by the resulting main push
        if: steps.commit.outputs.changed == 'true'
        run: echo "Source repaired and pushed to main; build workflows trigger from push."
