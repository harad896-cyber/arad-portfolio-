name: Fix group profile build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fix missing profile callback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("lib/group_management.dart")
          s = p.read_text()
          old = "onTap: addMembers"
          new = "onTap: openManagement"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          grep -q "onTap: openManagement" lib/group_management.dart
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/group_management.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: group profile build callback"
          git push origin HEAD:main
