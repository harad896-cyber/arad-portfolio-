name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name arad_messenger
          fi

      - name: Install Arad logo
        if: ${{ hashFiles('assets/app_icon.jpg') != '' }}
        run: |
          find android/app/src/main/res -type f -name 'ic_launcher.*' -delete
          mkdir -p android/app/src/main/res/mipmap
          cp assets/app_icon.jpg android/app/src/main/res/mipmap/ic_launcher.jpg
          sed -i 's/android:label="[^"]*"/android:label="Arad Messenger"/' android/app/src/main/AndroidManifest.xml

      - name: Normalize nullable avatar entry
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("        if (avatarUrl case final url?) 'avatar_url': url,", "        'avatar_url': avatarUrl,", 1)
          s = s.replace("        if (avatarUrl != null) 'avatar_url': avatarUrl,", "        'avatar_url': avatarUrl,", 1)
          p.write_text(s, encoding='utf-8')

      - name: Apply improved chat UI
        run: python tools/chat_ui_patch.py

      - name: Apply group and reaction features
        run: python tools/group_chat_features_patch.py

      - name: Apply premium chat features
        run: python tools/premium_chat_features_patch.py

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
