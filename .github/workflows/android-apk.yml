# Clean Android build pipeline; current Dart patch chain is verified before APK creation.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/build.gradle*', 'android/**/settings.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Regenerate clean Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.arad.messenger --project-name arad_messenger .
          test -f android/settings.gradle.kts || test -f android/settings.gradle
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
      - name: Set Android minimum SDK for current plugins
        shell: python
        run: |
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          p = next((x for x in candidates if x.exists()), None)
          if p is None: raise SystemExit('Android app Gradle file not found')
          s = p.read_text(encoding='utf-8')
          if p.suffix == '.kts':
              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion(24)')
          else:
              s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
          p.write_text(s, encoding='utf-8')
      - name: Install Arad logo
        if: ${{ hashFiles('assets/app_icon.jpg') != '' }}
        run: |
          find android/app/src/main/res -type f -name 'ic_launcher.*' -delete
          mkdir -p android/app/src/main/res/mipmap
          cp assets/app_icon.jpg android/app/src/main/res/mipmap/ic_launcher.jpg
          sed -i 's/android:label="[^"]*"/android:label="Arad Messenger"/' android/app/src/main/AndroidManifest.xml
      - name: Add microphone permission
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          perm = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if perm not in s: s = s.replace('>\n', '>\n    ' + perm + '\n', 1)
          p.write_text(s, encoding='utf-8')
      - name: Normalize nullable avatar entry
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart'); s = p.read_text(encoding='utf-8')
          s = s.replace("        if (avatarUrl case final url?) 'avatar_url': url,", "        'avatar_url': avatarUrl,", 1)
          s = s.replace("        if (avatarUrl != null) 'avatar_url': avatarUrl,", "        'avatar_url': avatarUrl,", 1)
          p.write_text(s, encoding='utf-8')
      - name: Apply improved chat UI
        run: python tools/chat_ui_patch.py
      - name: Apply group and reaction features
        run: python tools/group_chat_features_patch.py
      - name: Apply premium chat features
        run: python tools/premium_chat_features_patch.py
      - name: Finalize premium chat features
        run: python tools/premium_chat_finalize.py
      - name: Apply media and support fixes
        run: python tools/support_media_patch.py
      - name: Apply creation-limit and image hardening
        run: python tools/limits_media_hardening.py
      - name: Apply final chat/header/filter fixes
        run: python tools/final_ui_fix.py
      - name: Apply voice, profile header and final media fixes
        run: python tools/voice_profile_media_fix.py
      - name: Apply music sending
        run: python tools/music_send_patch.py
      - name: Apply saved messages
        run: python tools/saved_messages_patch.py
      - name: Apply selectable theme colors
        run: python tools/theme_colors_patch.py
      - name: Connect live theme controller
        run: python tools/theme_colors_runtime_fix.py
      - name: Apply notifications, read receipts and message stats
        run: python tools/notifications_read_receipts_patch.py
      - name: Elevate app and settings UI
        run: python tools/telegram_style_ui_patch.py
      - name: Repair audio compile issues
        run: python tools/fix_chat_audio_compile.py
      - name: Fix group and channel invite links
        run: python tools/group_channel_invite_fix.py
      - name: Apply safe owner dashboard and broadcast
        run: python tools/owner_broadcast_safe_patch.py
      - name: Apply security and efficiency rules
        run: python tools/security_efficiency_rules_patch.py
      - name: Apply professional message actions and modern chat UI
        run: python tools/message_actions_pro_patch.py
      - name: Repair message actions compile output
        run: python tools/message_actions_compile_fix.py
      - name: Final compile cleanup
        run: python tools/final_compile_cleanup.py
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Normalize Android Gradle Kotlin DSL before build
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion(24)')
              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              marker = '        ndk {\n            abiFilters += listOf("arm64-v8a")\n        }\n'
              if marker not in s and 'ndk {' not in s:
                  s = s.replace('    defaultConfig {\n', '    defaultConfig {\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Build release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Locate and prepare verified APK
        shell: bash
        run: |
          set -euo pipefail
          echo "APK files produced by Gradle:"
          find . -type f -name '*.apk' -size +1c -print -exec ls -lh {} \; || true
          APK="$(find . -type f -name 'app-release.apk' -size +1c | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find . -type f -name '*.apk' -size +1c | head -n 1)"
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: Gradle reported success but no non-empty APK file was found."
            exit 1
          fi
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
