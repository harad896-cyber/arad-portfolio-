name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Regenerate Android project
        run: |
          flutter create --platforms=android --org com.arad.messenger --project-name arad_messenger .
          test -f android/settings.gradle.kts || test -f android/settings.gradle
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Arad logo
        if: ${{ hashFiles('assets/app_icon.jpg') != '' }}
        run: |
          find android/app/src/main/res -type f -name 'ic_launcher.*' -delete
          mkdir -p android/app/src/main/res/mipmap
          cp assets/app_icon.jpg android/app/src/main/res/mipmap/ic_launcher.jpg
          sed -i 's/android:label="[^"]*"/android:label="Arad Messenger"/' android/app/src/main/AndroidManifest.xml
      - name: Add microphone permission
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          perm = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if perm not in s:
              s = s.replace('>\n', '>\n    ' + perm + '\n', 1)
          p.write_text(s, encoding='utf-8')
      - name: Normalize nullable avatar entry
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("        if (avatarUrl case final url?) 'avatar_url': url,", "        'avatar_url': avatarUrl,", 1)
          s = s.replace("        if (avatarUrl != null) 'avatar_url': avatarUrl,", "        'avatar_url': avatarUrl,", 1)
          p.write_text(s, encoding='utf-8')
      - name: Apply improved chat UI
        run: python tools/chat_ui_patch.py
      - name: Apply group and reaction features
        run: python tools/group_chat_features_patch.py
      - name: Apply premium chat features
        run: python tools/premium_chat_features_patch.py
      - name: Finalize premium chat features
        run: python tools/premium_chat_finalize.py
      - name: Apply media and support fixes
        run: python tools/support_media_patch.py
      - name: Apply creation-limit and image hardening
        run: python tools/limits_media_hardening.py
      - name: Apply final chat/header/filter fixes
        run: python tools/final_ui_fix.py
      - name: Apply voice, profile header and final media fixes
        run: python tools/voice_profile_media_fix.py
      - name: Apply music sending
        run: python tools/music_send_patch.py
      - name: Apply saved messages
        run: python tools/saved_messages_patch.py
      - name: Apply selectable theme colors
        run: python tools/theme_colors_patch.py
      - name: Connect live theme controller
        run: python tools/theme_colors_runtime_fix.py
      - name: Apply notifications, read receipts and message stats
        run: python tools/notifications_read_receipts_patch.py
      - name: Elevate app and settings UI
        run: python tools/telegram_style_ui_patch.py
      - name: Repair audio compile issues
        run: python tools/fix_chat_audio_compile.py
      - name: Fix group and channel invite links
        run: python tools/group_channel_invite_fix.py
      - name: Apply owner dashboard and message reports
        run: python tools/owner_admin_reports_patch.py
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
