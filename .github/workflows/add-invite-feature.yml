name: Add Invite Feature

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-invite-feature.yml'
      - 'lib/invite.dart'
      - 'pubspec.yaml'
      - 'lib/main.dart'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Patch HomePage with Invite drawer
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          if "import 'invite.dart';" not in text:
              marker = "import 'package:image_picker/image_picker.dart';"
              if marker not in text:
                  raise SystemExit('image_picker import marker not found')
              text = text.replace(marker, marker + "\nimport 'invite.dart';", 1)

          if 'drawer: const InviteDrawer(),' not in text:
              m = re.search(r'class\s+HomePage\b[\s\S]*?(?=^class\s+|\Z)', text, re.MULTILINE)
              if not m:
                  raise SystemExit('HomePage class not found')
              section = m.group(0)
              scaffold = section.find('return Scaffold(')
              if scaffold < 0:
                  raise SystemExit('HomePage Scaffold not found')
              insert_at = scaffold + len('return Scaffold(')
              section = section[:insert_at] + "\n      drawer: const InviteDrawer()," + section[insert_at:]
              text = text[:m.start()] + section + text[m.end():]

          path.write_text(text, encoding='utf-8')

      - name: Verify dependencies and analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/invite.dart pubspec.yaml
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "Add invite friends feature"
            git push
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-invite-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
