name: Add Invite Feature

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-invite-feature.yml'
      - 'lib/invite.dart'
      - 'pubspec.yaml'
      - 'lib/main.dart'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Verify dependencies and analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-invite-build
          path: build/app/outputs/flutter-apk/app-release.apk
