name: Apply Voice Player Controls

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Patch voice player controls
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          if "import 'voice_message_player.dart';" not in s:
              s = s.replace("import 'call_session.dart';", "import 'call_session.dart';\nimport 'voice_message_player.dart';", 1)

          replacement = '''  Widget _voicePlayButton(String messageId) {
    final a = attachments[messageId];
    final durationMs = (a?['duration_ms'] as num?)?.toInt() ?? 0;
    return VoiceMessagePlayer(
      initialDurationMs: durationMs,
      mine: true,
      loadAudio: () async {
        final path = attachments[messageId]?['storage_path']?.toString() ?? '';
        if (path.isEmpty) throw Exception('مسیر فایل صوتی خالی است');
        final bytes = await supabase.storage.from('chat-media').download(path);
        if (bytes.isEmpty) throw Exception('فایل صوتی خالی است');
        return bytes;
      },
    );
  }

'''

          pattern = r"  Widget _voicePlayButton\(String messageId\) \{.*?\n  \}\n\n  String _time\(dynamic value\) \{"
          ns, n = re.subn(pattern, replacement + "  String _time(dynamic value) {", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('voice player method was not found')
          s = ns
          p.write_text(s, encoding='utf-8')

          if not Path('lib/voice_message_player.dart').exists():
              raise SystemExit('voice_message_player.dart is missing')

      - name: Commit repaired source
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo 'Voice controls already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart lib/voice_message_player.dart
          git commit -m 'feat: add voice duration seek rewind forward and speed controls'
          git push origin HEAD:main
