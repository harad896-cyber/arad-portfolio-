name: Repair Email OTP and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover known clean source once
        shell: bash
        run: |
          if [ ! -f .github/recovery.done ]; then
            git checkout 6e215c34a2bc44bdab38462b53528522b43362cf -- lib/main.dart
            printf 'clean app source recovered\n' > .github/recovery.done
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/main.dart .github/recovery.done
            git commit -m 'fix: restore known clean chat and profile source'
            git push
          else
            echo 'Clean source already persisted.'
          fi

      - name: Repair OTP flow in source
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r"\n\s*if \(normalized\.length == 6 && !busy && !_verificationStarted\) \{\n\s*verify\(\);\n\s*\}", '', text)
          text = re.sub(r"\n\s*onSubmitted: \(_\) \{\n\s*if \(!busy\) verify\(\);\n\s*\},", '', text)
          text = text.replace("hintText: '۱۲۳۴۵۶'", "hintText: '------'")
          text = text.replace("hintText: '123456'", "hintText: '------'")
          text = text.replace('بعد از وارد کردن رقم ششم، کد خودکار بررسی می‌شود و در صورت درست بودن وارد برنامه می‌شوید.', 'کد فقط وقتی بررسی می‌شود که روی «تأیید و ورود» بزنید. کدهای قبلی یا منقضی‌شده قابل استفاده نیستند.')
          text = text.replace('پس از ارسال، یک کد ۶ رقمی به ایمیل شما می‌آید و بعد از رقم ششم خودکار بررسی می‌شود.', 'پس از ارسال، یک کد دقیقاً ۶ رقمی به ایمیل شما می‌آید. کد فقط با زدن «تأیید و ورود» بررسی می‌شود.')
          path.write_text(text, encoding='utf-8')

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.arad.messenger .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            flutter build apk --release --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          else
            flutter build apk --release
          fi

      - name: Sign release APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "${APK%.apk}-aligned.apk"
          mv "${APK%.apk}-aligned.apk" "$APK"
          "$BUILD_TOOLS/apksigner" sign --ks android/app/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-final-chat-profile-fix
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
