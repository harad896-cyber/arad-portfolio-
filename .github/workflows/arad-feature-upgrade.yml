name: Arad Messenger Feature Upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/arad-feature-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Apply real feature wiring
        run: python3 tools/feature_completion_patch.py

      - name: Format
        run: dart format lib/main.dart

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          if git diff --cached --quiet; then
            echo 'No source changes required'
          else
            git commit -m 'feat: wire Arad Messenger settings and creation flows'
            git push origin HEAD:main
          fi
