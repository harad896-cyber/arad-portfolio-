name: Final Green Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and publish build fix
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("lib/main.dart")
          s=p.read_text(encoding="utf-8")
          method="""  Future<void> _loadGroupMemberCount() async {
              if (_chatType != 'group') return;
              try {
                final rows = await supabase.from('conversation_members').select('user_id').eq('conversation_id', widget.id);
                if (!mounted) return;
                setState(() => _groupMemberCount = (rows as List).length);
              } catch (_) {}
            }

          """
          s=re.sub(r"\n\s*Future<void> _loadGroupMemberCount\(\) async \{.*?\n\s*\}\n", "\n", s, count=1, flags=re.S)
          marker="class _ChatPageState extends State<ChatPage> {"
          if marker not in s: raise SystemExit("ChatPage marker not found")
          s=s.replace(marker,marker+"\n"+method,1)
          p.write_text(s,encoding="utf-8")
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/main.dart
            git commit -m "fix: restore ChatPage member count method [skip ci]" || true
            base=$(git rev-parse origin/main)
            if git push --force-with-lease=refs/heads/main:$base origin HEAD:main; then
              echo "source fix published"
              break
            fi
            echo "remote changed; retrying"
            sleep 2
          done
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub
      - run: flutter build apk --release --no-pub
      - run: test -s build/app/outputs/flutter-apk/app-release.apk
