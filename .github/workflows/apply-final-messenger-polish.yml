name: Apply final messenger polish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Apply deterministic source polish
        run: python3 tools/polish_final.py
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/main.dart
      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Commit polished source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          if git diff --cached --quiet; then
            echo 'No source changes required'
            exit 0
          fi
          git commit -m 'perf: polish chat loading and media caching'
          git push origin HEAD:main
