name: Repair messenger core
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair known runtime bugs
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = r"'\${Directory.systemTemp.path}/arad_voice_\${DateTime.now().millisecondsSinceEpoch}.m4a'"
          new = "'${Directory.systemTemp.path}/arad_voice_${DateTime.now().millisecondsSinceEpoch}.m4a'"
          s = s.replace(old, new)
          old = r"'\${widget.id}/voice_\${DateTime.now().millisecondsSinceEpoch}.m4a'"
          new = "'${widget.id}/voice_${DateTime.now().millisecondsSinceEpoch}.m4a'"
          s = s.replace(old, new)
          s = s.replace("Row(children: List.generate(4, (i) {", "Row(children: List.generate(5, (i) {")
          s = s.replace("supabase.from('saved_messages').select('id, body, message_type, created_at').order('created_at', ascending: false)", "supabase.from('saved_messages').select('id, body, message_type, created_at').eq('user_id', supabase.auth.currentUser!.id).order('created_at', ascending: false)")
          p.write_text(s)
          p = Path('lib/notifications_page.dart')
          s = p.read_text()
          needle = "Future<void> load() async {\n    try {"
          if needle in s:
            s = s.replace(needle, "Future<void> load() async {\n    rows = [];\n    try {", 1)
          p.write_text(s)
          PY
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart lib/notifications_page.dart
          if git diff --cached --quiet; then echo 'No source changes required'; exit 0; fi
          git commit -m 'fix: repair messenger voice, filters and saved messages'
          git push origin HEAD:main
