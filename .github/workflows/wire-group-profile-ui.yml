name: Wire Group Profile UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Wire group profile header
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          s=p.read_text(encoding='utf-8')
          if '// GROUP_PROFILE_WIRED' in s:
              print('already wired')
              raise SystemExit(0)
          old="""        title: Row(\n          children: [\n            const CircleAvatar(radius: 17, child: Icon(Icons.person, size: 18)),\n            const SizedBox(width: 9),\n            Expanded(\n              child: Text(\n                widget.title,\n                overflow: TextOverflow.ellipsis,\n                style: const TextStyle(fontWeight: FontWeight.w800),\n              ),\n            ),\n          ],\n        ),"""
          new="""        title: InkWell(\n          borderRadius: BorderRadius.circular(18),\n          onTap: () {\n            if (_chatType == 'group') {\n              Navigator.push(context, MaterialPageRoute(builder: (_) => GroupProfilePage(conversationId: widget.id, title: widget.title)));\n            }\n          },\n          child: Row(\n            children: [\n              const CircleAvatar(radius: 17, child: Icon(Icons.groups_rounded, size: 18)),\n              const SizedBox(width: 9),\n              Expanded(\n                child: Column(\n                  crossAxisAlignment: CrossAxisAlignment.start,\n                  mainAxisSize: MainAxisSize.min,\n                  children: [\n                    Text(widget.title, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.w800)),\n                    if (_chatType == 'group')\n                      const Text('پروفایل گروه', style: TextStyle(fontSize: 10.5, fontWeight: FontWeight.w500)),\n                  ],\n                ),\n              ),\n            ],\n          ),\n        ), // GROUP_PROFILE_WIRED"""
          if old not in s:
              raise SystemExit('expected chat header not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: open real group profile from chat header'
          git push
