name: GapResan Android and Web test build

on:
  push:
    branches:
      - project2/online-presence-read-receipts-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Generate missing Android and Web platform scaffolding
        run: |
          flutter create --platforms=android,web --org com.gapresan --project-name arad_messenger .
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s web/index.html

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Web preview
        run: flutter build web --release

      - name: Verify build outputs
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/web/index.html

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gapresan-android-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: gapresan-web-test
          path: build/web
          if-no-files-found: error
          retention-days: 14
