name: GapResan Android and Web test build

on:
  push:
    branches:
      - project2/online-presence-read-receipts-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # Keep the test APK signing certificate stable so its SHA-1 can be
      # registered once as the Android OAuth client in Google Cloud.
      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gapresan-google-oauth-debug-keystore-v1

      # A cache miss is normal on the first run. Create the standard debug
      # certificate before printing its fingerprint; the cache action saves it
      # after a successful job so subsequent runs keep the same SHA-1.
      - name: Create test signing key when cache is empty
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null

      - name: Generate missing Android and Web platform scaffolding
        run: |
          flutter create --platforms=android,web --org com.gapresan --project-name arad_messenger .
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/build.gradle.kts
          test -s android/gradle/wrapper/gradle-wrapper.properties
          test -s web/index.html

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          GOOGLE_CLIENT_ID="641767616232-bk6t4vhokbpjdj57uih2gjd10bls5lo3.apps.googleusercontent.com"
          flutter build apk --release --dart-define="GOOGLE_SERVER_CLIENT_ID=$GOOGLE_CLIENT_ID"

      - name: Print Android test signing SHA-1 for Google OAuth
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            | grep -E 'SHA1:|SHA256:'

      # GitHub Pages serves this repository below /arad-portfolio-/.
      # The root base-href makes Flutter request JS/assets from the wrong URL,
      # which can leave the deployed app as a blank page.
      - name: Build Web for GitHub Pages subpath
        run: |
          flutter build web --release --no-wasm-dry-run --base-href "/arad-portfolio-/"

      - name: Verify Android and Web release outputs
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          test -s build/web/main.dart.js
          if grep -q '\$FLUTTER_BASE_HREF' build/web/index.html; then
            echo "Unexpanded Flutter base href found in web/index.html"
            exit 1
          fi
          grep -Fq '<base href="/arad-portfolio-/">' build/web/index.html
          test -d build/web/assets

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gapresan-android-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: gapresan-web-test
          path: build/web
          if-no-files-found: error
          retention-days: 14
