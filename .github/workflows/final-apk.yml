name: Final Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.35.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create fresh Android host
        run: |
          rm -rf android
          flutter create --platforms=android --org com.arad.messenger --project-name arad_messenger .
          test -f android/settings.gradle.kts || test -f android/settings.gradle
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Set Android build requirements
        shell: python
        run: |
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          p = next(x for x in candidates if x.exists())
          s = p.read_text(encoding="utf-8")
          if p.suffix == ".kts":
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion(24)")
          else:
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
          p.write_text(s, encoding="utf-8")

      - name: Add Android microphone permission
        shell: python
        run: |
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          perm = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if perm not in s:
              s = s.replace("<manifest", "<manifest", 1)
              marker = "<uses-permission android.permission"
              # Insert immediately after the manifest opening tag.
              end = s.find(">")
              s = s[:end+1] + "\n    " + perm + s[end+1:]
          s = s.replace('android:label="arad_messenger"', 'android:label="Arad Messenger"')
          p.write_text(s, encoding="utf-8")

      - name: Get dependencies
        run: flutter pub get

      - name: Flutter analyze (diagnostic)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee flutter-analyze.txt

      - name: Flutter tests (diagnostic)
        continue-on-error: true
        run: flutter test 2>&1 | tee flutter-test.txt

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arad-final-diagnostics
          path: |
            flutter-analyze.txt
            flutter-test.txt
          if-no-files-found: warn
