name: Final Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Repair and align messenger design system
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          # Runtime fixes.
          s = s.replace(r"'\${Directory.systemTemp.path}/arad_voice_\${DateTime.now().millisecondsSinceEpoch}.m4a'", "'${Directory.systemTemp.path}/arad_voice_${DateTime.now().millisecondsSinceEpoch}.m4a'")
          s = s.replace(r"'\${widget.id}/voice_\${DateTime.now().millisecondsSinceEpoch}.m4a'", "'${widget.id}/voice_${DateTime.now().millisecondsSinceEpoch}.m4a'")
          s = s.replace("Row(children: List.generate(4, (i) {", "Row(children: List.generate(5, (i) {")
          s = s.replace("supabase.from('saved_messages').select('id, body, message_type, created_at').order('created_at', ascending: false)", "supabase.from('saved_messages').select('id, body, message_type, created_at').eq('user_id', supabase.auth.currentUser!.id).order('created_at', ascending: false)")

          # Project 1 design tokens: Vazirmatn, #09090b/#f5f5f7 surfaces, purple-blue accent,
          # subtle glass cards, 20-22px corners, low-contrast borders, clean typography.
          s = s.replace("int seed = 0xFF5B6FB5;", "int seed = 0xFF7C5CFF;")
          s = s.replace("p.getInt('accent_seed_$key') ?? 0xFF5B6FB5", "p.getInt('accent_seed_$key') ?? 0xFF7C5CFF")
          s = s.replace("surface: const Color(0xFFF4F6FA),", "surface: const Color(0xFFF5F5F7),")
          s = s.replace("scaffoldBackgroundColor: const Color(0xFFF4F6FA),", "scaffoldBackgroundColor: Colors.transparent,")
          s = s.replace("backgroundColor: Color(0xDFF4F6FA),", "backgroundColor: Color(0xC2F5F5F7),")
          s = s.replace("color: Color(0xFF151821),", "color: Color(0xFF16161A),")
          s = s.replace("iconTheme: IconThemeData(color: Color(0xFF30323A)),", "iconTheme: IconThemeData(color: Color(0xFF707078)),")
          s = s.replace("borderSide: BorderSide(color: Color(0x1A4F46E5)),", "borderSide: BorderSide(color: Color(0x19000000)),")
          s = s.replace("borderRadius: BorderRadius.all(Radius.circular(18)),", "borderRadius: BorderRadius.all(Radius.circular(20)),")
          s = s.replace("borderSide: BorderSide(color: Color(0x26303746)),", "borderSide: BorderSide(color: Color(0x19000000)),")
          s = s.replace("borderSide: BorderSide(color: Color(0x1F30323A)),", "borderSide: BorderSide(color: Color(0x17000000)),")
          s = s.replace("borderSide: BorderSide(color: Color(0xFF4F46E5), width: 1.6),", "borderSide: BorderSide(color: Color(0xFF7C5CFF), width: 1.6),")
          s = s.replace("shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(15)),", "shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),")
          s = s.replace("textStyle: const TextStyle(fontSize: 16, fontWeight: FontWeight.w800),", "textStyle: const TextStyle(fontSize: 15, fontWeight: FontWeight.w700),")
          s = s.replace("minimumSize: const Size.fromHeight(52),", "minimumSize: const Size.fromHeight(50),")
          s = s.replace("borderRadius: BorderRadius.circular(14)", "borderRadius: BorderRadius.circular(12)")
          s = s.replace("color: Color(0x16000000),", "color: Color(0x17000000),")

          # Dark Project 1 tokens.
          s = s.replace("primary: const Color(0xFF6E83C4),\n          secondary: const Color(0xFF8B5FBF),\n          tertiary: const Color(0xFFB45CC8),\n          surface: const Color(0xFF111014),", "surface: const Color(0xFF111114),")
          s = s.replace("scaffoldBackgroundColor: const Color(0xFF111014),", "scaffoldBackgroundColor: Colors.transparent,")
          s = s.replace("backgroundColor: Color(0xE6111014),", "backgroundColor: Color(0xC209090B),")
          s = s.replace("color: Color(0xB81C1A20),", "color: Color(0x0AFFFFFF),")
          s = s.replace("borderSide: BorderSide(color: Color(0x1FFFFFFF)),", "borderSide: BorderSide(color: Color(0x17FFFFFF)),")
          s = s.replace("fillColor: Color(0xB81C1A20),", "fillColor: Color(0x0AFFFFFF),")
          s = s.replace("borderSide: BorderSide(color: Color(0x24FFFFFF)),", "borderSide: BorderSide(color: Color(0x17FFFFFF)),")
          s = s.replace("borderSide: BorderSide(color: Color(0x22FFFFFF)),", "borderSide: BorderSide(color: Color(0x14FFFFFF)),")
          s = s.replace("borderSide: BorderSide(color: Color(0xFF7C8FD6), width: 1.6),", "borderSide: BorderSide(color: Color(0xFFA996FF), width: 1.6),")

          # Apply the Project 1 soft purple glow behind all messenger pages.
          if "builder: (context, child) => Container(" not in s:
              needle = "      themeMode: appTheme.dark ? ThemeMode.dark : ThemeMode.light,"
              replacement = """      builder: (context, child) => Container(\n        decoration: BoxDecoration(\n          color: Theme.of(context).scaffoldBackgroundColor,\n          gradient: RadialGradient(\n            center: const Alignment(0.85, -0.95),\n            radius: 1.15,\n            colors: [\n              Color(0x247C5CFF),\n              Theme.of(context).scaffoldBackgroundColor,\n            ],\n          ),\n        ),\n        child: child!,\n      ),\n      themeMode: appTheme.dark ? ThemeMode.dark : ThemeMode.light,"""
              s = s.replace(needle, replacement, 1)

          # Global typography fallback to the same family name used by Project 1.
          s = s.replace("useMaterial3: true,\n        colorScheme:", "useMaterial3: true,\n        fontFamily: 'Vazirmatn',\n        colorScheme:")
          p.write_text(s, encoding='utf-8')

          # Keep profile/sheets on Project 1's compact 20-22px corner language.
          for f in Path('lib').glob('*.dart'):
              if f.name == 'main.dart':
                  continue
              x = f.read_text(encoding='utf-8')
              x = x.replace('BorderRadius.circular(26)', 'BorderRadius.circular(22)')
              x = x.replace('BorderRadius.circular(30)', 'BorderRadius.circular(22)')
              f.write_text(x, encoding='utf-8')

          p = Path('lib/notifications_page.dart')
          s = p.read_text(encoding='utf-8')
          needle = "Future<void> load() async {\n    try {"
          if needle in s:
              s = s.replace(needle, "Future<void> load() async {\n    rows = [];\n    try {", 1)
          p.write_text(s, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo 'No source repair/design changes needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/main.dart lib/notifications_page.dart lib/*.dart
            git commit -m 'style: align messenger pages with Project 1 design system'
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.35.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Android host only when needed
        run: |
          if [ ! -f android/settings.gradle.kts ] && [ ! -f android/settings.gradle ]; then
            flutter create --platforms=android --org com.arad.messenger --project-name arad_messenger .
          fi

      - name: Set Android build requirements
        shell: python
        run: |
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          p = next(x for x in candidates if x.exists())
          s = p.read_text(encoding='utf-8')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
          s = s.replace('minSdkVersion(24)', 'minSdkVersion 24')
          p.write_text(s, encoding='utf-8')

      - name: Add required Android permissions
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          marker = '</manifest>'
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for perm in permissions:
              if perm not in s:
                  s = s.replace(marker, perm + '\n' + marker)
          s = s.replace('android:label="arad_messenger"', 'android:label="Arad Messenger"')
          p.write_text(s, encoding='utf-8')

      - name: Get dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee flutter-analyze.txt

      - name: Flutter tests
        run: flutter test --exclude-tags=integration 2>&1 | tee flutter-test.txt

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Verify APK and commit identity
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" | tee build/app/source-commit.txt
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/apk-sha256.txt
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-final-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/source-commit.txt
            build/app/apk-sha256.txt
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arad-final-diagnostics-${{ github.sha }}
          path: |
            flutter-analyze.txt
            flutter-test.txt
          if-no-files-found: warn
