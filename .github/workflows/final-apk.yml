name: Final Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.35.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Android host only when needed
        run: |
          if [ ! -f android/settings.gradle.kts ] && [ ! -f android/settings.gradle ]; then
            flutter create --platforms=android --org com.arad.messenger --project-name arad_messenger .
          fi

      - name: Set Android build requirements
        shell: python
        run: |
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          p = next(x for x in candidates if x.exists())
          s = p.read_text(encoding='utf-8')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
          s = s.replace('minSdkVersion(24)', 'minSdkVersion 24')
          p.write_text(s, encoding='utf-8')

      - name: Add required Android permissions
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          marker = '</manifest>'
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for perm in permissions:
              if perm not in s:
                  s = s.replace(marker, perm + '\n' + marker)
          s = s.replace('android:label="arad_messenger"', 'android:label="Arad Messenger"')
          p.write_text(s, encoding='utf-8')

      - name: Get dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee flutter-analyze.txt

      - name: Flutter tests
        run: flutter test --exclude-tags=integration 2>&1 | tee flutter-test.txt

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Verify APK and commit identity
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          echo "SOURCE_COMMIT=${GITHUB_SHA}" | tee build/app/source-commit.txt
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/apk-sha256.txt
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-final-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/source-commit.txt
            build/app/apk-sha256.txt
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arad-final-diagnostics-${{ github.sha }}
          path: |
            flutter-analyze.txt
            flutter-test.txt
          if-no-files-found: warn
