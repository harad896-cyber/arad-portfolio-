name: Final Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply final chat fixes
        run: python tools/fix_delete_for_everyone.py

      - name: Apply complete group system
        run: python tools/apply_complete_group_system.py

      - name: Commit group system to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart pubspec.yaml tools/apply_complete_group_system.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: complete Telegram-like group management"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.35.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create fresh Android host
        run: |
          rm -rf android
          flutter create --platforms=android --org com.arad.messenger --project-name arad_messenger .
          test -f android/settings.gradle.kts || test -f android/settings.gradle
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Set Android build requirements
        shell: python
        run: |
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          p = next(x for x in candidates if x.exists())
          s = p.read_text(encoding="utf-8")
          if p.suffix == ".kts":
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion(24)")
          else:
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
          p.write_text(s, encoding="utf-8")

      - name: Add Android microphone and internet permissions
        shell: python
        run: |
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          manifest_end = s.find(">")
          if manifest_end < 0:
              raise SystemExit("AndroidManifest manifest tag not found")
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          prefix = s[:manifest_end + 1]
          suffix = s[manifest_end + 1:]
          for permission in permissions:
              if permission not in s:
                  prefix += "\n    " + permission
          s = prefix + suffix
          s = s.replace('android:label="arad_messenger"', 'android:label="Arad Messenger"')
          p.write_text(s, encoding="utf-8")

      - name: Get dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze 2>&1 | tee flutter-analyze.txt

      - name: Flutter tests
        run: flutter test --exclude-tags=integration 2>&1 | tee flutter-test.txt

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arad-final-diagnostics
          path: |
            flutter-analyze.txt
            flutter-test.txt
          if-no-files-found: warn
