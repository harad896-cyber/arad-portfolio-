name: Green Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply ChatPage build fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("lib/main.dart")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r"\n\s*Future<void> _loadGroupMemberCount\(\) async \{.*?\n\s*\}\n", "\n", s, count=1, flags=re.S)
          marker="class _ChatPageState extends State<ChatPage> {"
          method="""  Future<void> _loadGroupMemberCount() async {
              if (_chatType != 'group') return;
              try {
                final rows = await supabase
                    .from('conversation_members')
                    .select('user_id')
                    .eq('conversation_id', widget.id);
                if (!mounted) return;
                setState(() {
                  _groupMemberCount = (rows as List).length;
                });
              } catch (_) {}
            }

          """
          if marker not in s: raise SystemExit("ChatPage marker not found")
          s=s.replace(marker, marker+"\n"+method, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit fix safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add lib/main.dart
          git diff --cached --quiet || git commit -m "fix: restore ChatPage member count method [skip ci]"
          git push origin HEAD:main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub
      - run: flutter build apk --release --no-pub
      - run: test -s build/app/outputs/flutter-apk/app-release.apk
