name: Flutter validation

on:
  push:
    branches:
      - project2/theme-foundation
  pull_request:
    branches:
      - project2/theme-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Project 2
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --no-pub

      - name: Build web preview artifact
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: gapresan-web
          path: build/web/
          if-no-files-found: error
          retention-days: 7
