name: Private Chat Header and Blue Tick

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Patch private chat header
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          if '_peerProfile' not in s:
              s = s.replace("  int _groupMemberCount = 0;\n", "  int _groupMemberCount = 0;\n  Map<String, dynamic>? _peerProfile;\n", 1)

          old_load = """      final type = (r?['type'] ?? 'direct').toString();
      var count = 0;
      if (type == 'group') {
        final rows = await supabase.from('conversation_members').select('user_id').eq('conversation_id', widget.id);
        count = (rows as List).length;
      }
      if (mounted) setState(() { _chatType = type; _groupMemberCount = count; });
"""
          new_load = """      final type = (r?['type'] ?? 'direct').toString();
      var count = 0;
      Map<String, dynamic>? peer;
      if (type == 'group') {
        final rows = await supabase.from('conversation_members').select('user_id').eq('conversation_id', widget.id);
        count = (rows as List).length;
      } else if (type == 'direct') {
        final uid = supabase.auth.currentUser?.id;
        if (uid != null) {
          final members = await supabase.from('conversation_members').select('user_id').eq('conversation_id', widget.id);
          final ids = List<Map<String, dynamic>>.from(members).map((x) => '${x['user_id']}').where((id) => id != uid).toList();
          if (ids.isNotEmpty) {
            final people = await supabase.from('profiles').select('id,display_name,username,avatar_url,is_verified').inFilter('id', [ids.first]);
            if (people.isNotEmpty) peer = Map<String, dynamic>.from(people.first);
          }
        }
      }
      if (mounted) setState(() { _chatType = type; _groupMemberCount = count; _peerProfile = peer; });
"""
          if old_load in s:
              s = s.replace(old_load, new_load, 1)

          old_people = "select('id,display_name,username,avatar_url').inFilter('id', senderIds)"
          new_people = "select('id,display_name,username,avatar_url,is_verified').inFilter('id', senderIds)"
          s = s.replace(old_people, new_people)

          old_avatar = """              const CircleAvatar(radius: 17, child: Icon(Icons.groups_rounded, size: 18)),
              const SizedBox(width: 9),
"""
          new_avatar = """              CircleAvatar(
                radius: 19,
                backgroundImage: (_chatType == 'direct' && (_peerProfile?['avatar_url'] ?? '').toString().isNotEmpty)
                    ? NetworkImage('${_peerProfile?['avatar_url']}')
                    : null,
                child: (_chatType == 'direct' && (_peerProfile?['avatar_url'] ?? '').toString().isEmpty)
                    ? const Icon(Icons.person_rounded, size: 20)
                    : (_chatType != 'direct' ? const Icon(Icons.groups_rounded, size: 20) : null),
              ),
              const SizedBox(width: 9),
"""
          if old_avatar in s:
              s = s.replace(old_avatar, new_avatar, 1)

          old_title = """                    Text(widget.title, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.w800)),
                    if (_chatType == 'group')
"""
          new_title = """                    Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Flexible(child: Text(widget.title, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.w800))),
                        if (_chatType == 'direct' && _peerProfile?['is_verified'] == true) ...[
                          const SizedBox(width: 4),
                          const Icon(Icons.verified_rounded, size: 16, color: Color(0xFF2196F3)),
                        ],
                      ],
                    ),
                    if (_chatType == 'group')
"""
          if old_title in s:
              s = s.replace(old_title, new_title, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify source
        run: |
          grep -n "_peerProfile" lib/main.dart
          grep -n "is_verified" lib/main.dart | head -n 10
          grep -n "verified_rounded" lib/main.dart

      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet || git commit -m "feat: style private chat header and show blue verification"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --no-pub

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-private-chat-blue-tick-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
