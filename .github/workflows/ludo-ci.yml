name: GapResan Ludo validation

on:
  push:
    branches:
      - feature/gapresan-dice-prototype
      - feature/gapresan-ludo-league-ui-20261115
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/ludo_*.dart'
      - 'test/ludo_*_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/ludo-ci.yml'

permissions:
  contents: read

concurrency:
  group: ludo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format Ludo changes
        run: dart format lib/ludo_game.dart lib/ludo_bot_policy.dart test/ludo_bot_policy_test.dart

      - name: Run Ludo unit tests
        run: flutter test test/ludo_bot_policy_test.dart test/ludo_engine_test.dart test/ludo_move_decision_test.dart test/ludo_rules_test.dart

      - name: Analyze Flutter project
        run: flutter analyze --no-pub

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: gapresan-ludo-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
