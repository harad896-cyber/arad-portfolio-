name: Project 2 APK Build

concurrency:
  group: project2-apk-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Generate supported Android project
        run: flutter create --platforms=android --project-name arad_messenger .
      - run: flutter pub get
      - name: Add Android call permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<application'
          permissions = '    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n'
          if 'android.permission.CAMERA' not in s:
              s = s.replace(marker, permissions + marker, 1)
          p.write_text(s)
          PY
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --no-pub
      - run: flutter build apk --release --no-pub
      - name: Verify release APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
