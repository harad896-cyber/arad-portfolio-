name: Project 2 APK Build

concurrency:
  group: project2-apk-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Generate supported Android project
        run: flutter create --platforms=android --project-name arad_messenger .
      - name: Ensure Android plugin repositories are available
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/settings.gradle.kts')
          lines = p.read_text().splitlines()
          plugin_line = next((i for i, line in enumerate(lines) if 'pluginManagement {' in line), None)
          if plugin_line is None:
              raise SystemExit('pluginManagement block missing from generated Android settings')
          repo_line = next((i for i in range(plugin_line + 1, len(lines)) if 'repositories {' in lines[i]), None)
          if repo_line is None:
              raise SystemExit('pluginManagement.repositories block missing')
          close_line = next((i for i in range(repo_line + 1, len(lines)) if lines[i].strip() == '}'), None)
          if close_line is None:
              raise SystemExit('Could not find end of pluginManagement.repositories')
          body = ''.join(lines[repo_line + 1:close_line])
          additions = []
          if 'google()' not in body:
              additions.append('google()')
          if 'mavenCentral()' not in body:
              additions.append('mavenCentral()')
          for item in reversed(additions):
              lines.insert(repo_line + 1, '        ' + item)
          p.write_text(chr(10).join(lines) + chr(10))
          print('Android plugin repositories verified; added:', ', '.join(additions) if additions else 'none needed')
          PY
      - run: flutter pub get
      - name: Apply GapResan app branding and adaptive launcher icons
        run: |
          python3 -m pip install --quiet pillow cairosvg
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          root = Path('android/app/src/main')
          manifest = root / 'AndroidManifest.xml'
          s = manifest.read_text()
          s = re.sub(r'android:label="[^"]+"', 'android:label="پیام رسان"', s, count=1)
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', s, count=1)
          if 'android:roundIcon=' in s:
              s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', s, count=1)
          else:
              s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
          manifest.write_text(s)
          values = root / 'res/values'
          values.mkdir(parents=True, exist_ok=True)
          strings = values / 'strings.xml'
          x = strings.read_text() if strings.exists() else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
          if re.search(r'<string name="app_name">.*?</string>', x, re.S):
              x = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">پیام رسان</string>', x, flags=re.S)
          else:
              x = x.replace('</resources>', '    <string name="app_name">گپ‌رسان</string>\n</resources>')
          strings.write_text(x)
          import cairosvg
          cairosvg.svg2png(url='assets/app_icon.svg', write_to='assets/app_icon.png', output_width=1024, output_height=1024)
          source = Image.open('assets/app_icon.png').convert('RGBA')
          source.convert('RGB').save('assets/app_icon.jpg', quality=95)
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder, size in sizes.items():
              d = root / 'res' / folder
              d.mkdir(parents=True, exist_ok=True)
              source.resize((size,size), Image.Resampling.LANCZOS).save(d / 'ic_launcher.png')
              source.resize((size,size), Image.Resampling.LANCZOS).save(d / 'ic_launcher_round.png')
              fg = Image.new('RGBA', (size,size), (0,0,0,0))
              inner = source.copy()
              inner.thumbnail((int(size*.68), int(size*.68)), Image.Resampling.LANCZOS)
              fg.alpha_composite(inner, ((size-inner.width)//2, (size-inner.height)//2))
              fg.save(d / 'ic_launcher_foreground.png')
          anydpi = root / 'res/mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          (anydpi / 'ic_launcher.xml').write_text(adaptive)
          (anydpi / 'ic_launcher_round.xml').write_text(adaptive)
          colors = values / 'colors.xml'
          old = colors.read_text() if colors.exists() else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
          if '<color name="ic_launcher_background">' in old:
              old = re.sub(r'<color name="ic_launcher_background">.*?</color>', '<color name="ic_launcher_background">#087F45</color>', old, flags=re.S)
          else:
              old = old.replace('</resources>', '    <color name="ic_launcher_background">#087F45</color>\n</resources>')
          colors.write_text(old)
          print('GapResan app label and legacy/adaptive launcher icons generated.')
          PY
      - name: Add Android call permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<application'
          permissions = '    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n'
          if 'android.permission.CAMERA' not in s:
              s = s.replace(marker, permissions + marker, 1)
          if 'android:scheme="arad"' not in s:
              intent_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="arad" android:host="invite" />
                      <data android:scheme="arad" android:host="group" />
                      <data android:scheme="arad" android:host="chat" />
                      <data android:scheme="arad" android:host="story" />
                  </intent-filter>
              '''
              if '</activity>' in s:
                  s = s.replace('</activity>', intent_filter + '\n        </activity>', 1)
          else:
              # Existing builds already register invite links; extend the same
              # activity filter so public group and message deep links launch the app.
              invite_data = '<data android:scheme="arad" android:host="invite" />'
              extra_data = '\n                      <data android:scheme="arad" android:host="group" />\n                      <data android:scheme="arad" android:host="chat" />\n                      <data android:scheme="arad" android:host="story" />'
              if invite_data in s and 'android:host="group"' not in s:
                  s = s.replace(invite_data, invite_data + extra_data, 1)
          p.write_text(s)
          PY
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --no-pub
      - name: Confirm Google Web client ID configuration
        run: echo "Google Web client ID configured for this APK build"
      - name: Build release APK with the pubspec version
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "'\"")"
          GOOGLE_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-691342224287-dmh8p55v2oenfjqffg1upfoho4g5klml.apps.googleusercontent.com}"
          test -n "$APP_VERSION"
          flutter build apk --release --no-pub \
            --dart-define="APP_VERSION=$APP_VERSION" \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=$GOOGLE_CLIENT_ID"
      - name: Verify release APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
