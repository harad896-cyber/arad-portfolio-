name: Emergency Downloadable APK

on:
  workflow_run:
    workflows: ["Flutter test build"]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Remove stale ChatPage member-count call
        run: sed -i 's/_loadChatType().then((_) => _loadGroupMemberCount());/_loadChatType();/' lib/main.dart
      - name: Analyze diagnostics
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Recreate supported Android host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --platforms=android --org com.arad.messenger --project-name arad_messenger .
          test -f android/gradlew
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              s = p.read_text(encoding='utf-8').replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              p.write_text(s, encoding='utf-8')
          else:
              p = Path('android/app/build.gradle')
              s = p.read_text(encoding='utf-8').replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Locate and stage APK
        shell: bash
        run: |
          set -euo pipefail
          echo "APK files produced by Gradle:"
          find . -type f -name '*.apk' -size +1c -print
          APK="$(find build android -type f -name '*.apk' -size +1c 2>/dev/null | head -n 1)"
          test -n "$APK"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-project-2-apk-final
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
