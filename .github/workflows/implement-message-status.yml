name: Implement real message status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch message delivery/read status
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          old = '''  Future<void> markRead() async {
    try {
      final rows = await supabase.from('messages').select('id').eq('conversation_id', widget.id).neq('sender_id', supabase.auth.currentUser!.id);
      for (final row in rows) {
        await supabase.rpc('mark_message_read', params: {'p_message_id': row['id']});
      }
    } catch (_) {}
  }
'''
          new = '''  Future<void> markRead() async {
    final uid = supabase.auth.currentUser?.id;
    if (uid == null) return;
    try {
      final rows = await supabase.from('messages')
          .select('id,sender_id')
          .eq('conversation_id', widget.id)
          .neq('sender_id', uid);
      for (final row in rows) {
        await supabase.from('message_reads').upsert({
          'message_id': row['id'],
          'user_id': uid,
          'read_at': DateTime.now().toUtc().toIso8601String(),
        }, onConflict: 'message_id,user_id');
        await supabase.from('messages').update({
          'read_at': DateTime.now().toUtc().toIso8601String(),
        }).eq('id', row['id']).neq('sender_id', uid);
      }
    } catch (_) {}
  }

  Future<void> markDeliveredForIncoming() async {
    final uid = supabase.auth.currentUser?.id;
    if (uid == null) return;
    try {
      final rows = await supabase.from('messages')
          .select('id,sender_id,delivered_at')
          .eq('conversation_id', widget.id)
          .neq('sender_id', uid);
      for (final row in rows) {
        if (row['delivered_at'] == null) {
          await supabase.from('messages').update({
            'delivered_at': DateTime.now().toUtc().toIso8601String(),
          }).eq('id', row['id']).neq('sender_id', uid);
        }
      }
    } catch (_) {}
  }
'''
          if old not in s:
              raise SystemExit('markRead block not found')
          s = s.replace(old, new, 1)

          old = '''      await markRead();
    } catch (e) {
'''
          new = '''      await markDeliveredForIncoming();
      await markRead();
    } catch (e) {
'''
          if old not in s:
              raise SystemExit('load status hook not found')
          s = s.replace(old, new, 1)

          old = '''                          Icon(m['read_at'] != null ? Icons.done_all_rounded : Icons.done_rounded, size: 15, color: m['read_at'] != null ? const Color(0xFF62B7FF) : textColor.withValues(alpha: .7)),
'''
          new = '''                          Icon(
                            m['read_at'] != null
                                ? Icons.done_all_rounded
                                : m['delivered_at'] != null
                                    ? Icons.done_all_rounded
                                    : Icons.done_rounded,
                            size: 15,
                            color: m['read_at'] != null
                                ? const Color(0xFF62B7FF)
                                : textColor.withValues(alpha: .7),
                          ),
'''
          if old not in s:
              raise SystemExit('tick widget not found')
          s = s.replace(old, new, 1)

          old = '''      .onPostgresChanges(
        event: PostgresChangeEvent.insert,
        schema: 'public',
        table: 'message_user_deletions',
        callback: (_) => load(),
      )
      .subscribe();  }
'''
          new = '''      .onPostgresChanges(
        event: PostgresChangeEvent.insert,
        schema: 'public',
        table: 'message_user_deletions',
        callback: (_) => load(),
      )
      .onPostgresChanges(
        event: PostgresChangeEvent.update,
        schema: 'public',
        table: 'message_reads',
        callback: (_) => load(),
      )
      .subscribe();
  }
'''
          if old not in s:
              raise SystemExit('realtime block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "feat: real message delivery and read status"
          git push
