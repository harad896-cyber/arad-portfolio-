name: GapResan browser preview

on:
  push:
    branches: [feature/gapresan-fun-zone]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gapresan-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Project 2
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build web app
        run: flutter build web --release --base-href /arad-portfolio-/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/
      - name: Deploy browser preview
        id: deployment
        uses: actions/deploy-pages@v4
