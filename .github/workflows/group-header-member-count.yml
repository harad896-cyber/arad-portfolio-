name: Group Header Member Count

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Patch group header
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          old_field = "  String _chatType = 'direct';\n"
          new_field = "  String _chatType = 'direct';\n  int _groupMemberCount = 0;\n"
          if old_field in s and '_groupMemberCount' not in s:
              s = s.replace(old_field, new_field, 1)

          old_method = """  Future<void> _loadChatType() async {\n    try {\n      final r = await supabase.from('conversations').select('type').eq('id', widget.id).maybeSingle();\n      if (mounted) setState(() { _chatType = (r?['type'] ?? 'direct').toString(); });\n    } catch (_) {}\n  }\n"""
          new_method = old_method + """\n  Future<void> _loadGroupMemberCount() async {\n    try {\n      if (_chatType != 'group') return;\n      final rows = await supabase.from('conversation_members').select('user_id').eq('conversation_id', widget.id);\n      if (mounted) setState(() => _groupMemberCount = (rows as List).length);\n    } catch (_) {}\n  }\n"""
          if old_method in s and '_loadGroupMemberCount' not in s:
              s = s.replace(old_method, new_method, 1)

          old_init = """    load();\n    _loadChatType();\n    channel = supabase.channel('chat-${widget.id}')\n"""
          new_init = """    load();\n    _loadChatType().then((_) => _loadGroupMemberCount());\n    channel = supabase.channel('chat-${widget.id}')\n"""
          if old_init in s:
              s = s.replace(old_init, new_init, 1)

          old_subtitle = """                    if (_chatType == 'group')\n                      const Text('پروفایل گروه', style: TextStyle(fontSize: 10.5, fontWeight: FontWeight.w500)),\n"""
          new_subtitle = """                    if (_chatType == 'group')\n                      Text(\n                        _groupMemberCount > 0 ? '$_groupMemberCount عضو' : 'اعضا',\n                        style: const TextStyle(fontSize: 10.5, fontWeight: FontWeight.w500),\n                      ),\n"""
          if old_subtitle in s:
              s = s.replace(old_subtitle, new_subtitle, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify source
        run: |
          grep -n "_groupMemberCount" lib/main.dart
          grep -n "عضو" lib/main.dart | tail -n 5

      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet || git commit -m "fix: show group member count under group name"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --no-pub

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-group-member-count-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
