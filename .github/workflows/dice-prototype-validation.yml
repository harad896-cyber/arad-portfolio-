name: Dice Prototype Validation
on:
  push:
    branches: [feature/gapresan-dice-prototype]
    paths:
      - 'server/games/dice-prototype/**'
      - '.github/workflows/dice-prototype-validation.yml'
  pull_request:
    paths:
      - 'server/games/dice-prototype/**'
      - '.github/workflows/dice-prototype-validation.yml'
  workflow_dispatch:
jobs:
  dice-logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test deterministic face orientations
        run: node --test server/games/dice-prototype/*.test.mjs
