name: GapResan Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [feature/gapresan-dice-prototype]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: gapresan-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Project 2
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.gapresan --project-name arad_messenger .
      - name: Build debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}
      - name: Upload installable Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: gapresan-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
