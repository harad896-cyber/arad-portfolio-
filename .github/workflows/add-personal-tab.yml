name: Add Personal Chat Tab

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'feat: add personal chat tab')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Personal tab to HomePage
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          old = s

          # Add selected tab state to HomePage only.
          home = s.index('class HomePage extends StatefulWidget')
          tail = s[home:]
          if "String selectedChatTab = 'all';" not in tail:
              tail = tail.replace("  bool loading = true;\n", "  bool loading = true;\n  String selectedChatTab = 'all';\n", 1)

          # Add a compact filter row above the conversation list. Personal means direct chats.
          marker = "      body: loading\n"
          tabs = '''      body: Column(\n        children: [\n          SizedBox(\n            height: 58,\n            child: SingleChildScrollView(\n              scrollDirection: Axis.horizontal,\n              padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),\n              child: Row(\n                children: [\n                  _chatTab('همه', 'all', Icons.forum_outlined),\n                  _chatTab('شخصی', 'direct', Icons.person_outline),\n                  _chatTab('گروه', 'group', Icons.groups_outlined),\n                  _chatTab('کانال', 'channel', Icons.campaign_outlined),\n                ],\n              ),\n            ),\n          ),\n          Expanded(\n            child: loading\n'''
          if marker in tail and "_chatTab('شخصی'" not in tail:
              tail = tail.replace(marker, tabs, 1)

          # Close the new Expanded/Column around the existing body expression.
          old_end = "                },\n              ),\n      floatingActionButton:"
          new_end = "                },\n              ),\n            ),\n          ),\n        ],\n      ),\n      floatingActionButton:"
          if old_end in tail and "            ),\n          ),\n        ],\n      ),\n      floatingActionButton:" not in tail:
              tail = tail.replace(old_end, new_end, 1)

          # Filter the list without changing database queries.
          list_marker = "              : ListView.builder(\n                  itemCount: chats.length,\n                  itemBuilder:"
          list_repl = "              : ListView.builder(\n                  itemCount: _visibleChats.length,\n                  itemBuilder:"
          tail = tail.replace(list_marker, list_repl, 1)
          tail = tail.replace("                    final c = chats[i];", "                    final c = _visibleChats[i];", 1)

          # Insert helper immediately before UserSearchDelegate.
          helper = '''\n  List<Map<String, dynamic>> get _visibleChats {\n    if (selectedChatTab == 'all') return chats;\n    return chats.where((c) => '${c['type'] ?? ''}' == selectedChatTab).toList();\n  }\n\n  Widget _chatTab(String label, String value, IconData icon) {\n    final selected = selectedChatTab == value;\n    return Padding(\n      padding: const EdgeInsetsDirectional.only(end: 8),\n      child: ChoiceChip(\n        avatar: Icon(icon, size: 18),\n        label: Text(label),\n        selected: selected,\n        onSelected: (_) => setState(() => selectedChatTab = value),\n      ),\n    );\n  }\n\n'''
          if "List<Map<String, dynamic>> get _visibleChats" not in tail:
              tail = tail.replace("}\n\nclass UserSearchDelegate", "}" + helper + "class UserSearchDelegate", 1)

          s = s[:home] + tail
          if s == old:
              print('No source change needed')
          else:
              p.write_text(s, encoding='utf-8')
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add','lib/main.dart'], check=True)
              subprocess.run(['git','commit','-m','feat: add personal chat tab'], check=True)
              subprocess.run(['git','push'], check=True)

      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-personal-tab.yml
          git commit -m 'chore: remove one-time personal tab workflow'
          git push
