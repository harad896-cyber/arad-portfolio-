name: GapResan Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - project2/theme-foundation
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-gapresan-android.yml'

permissions:
  contents: read

concurrency:
  group: gapresan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Generate Android platform and build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Project 2 test branch
        uses: actions/checkout@v4
        with:
          ref: project2/theme-foundation

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Verify Flutter and Dart
        run: |
          flutter --version
          dart --version

      - name: Generate missing Android project files
        run: |
          flutter create --platforms=android --org com.gapresan .
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build installable debug APK
        run: flutter build apk --debug --build-number=${GITHUB_RUN_NUMBER}

      - name: Upload APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: gapresan-android-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
