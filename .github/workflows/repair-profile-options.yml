name: One-time Dart lint repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-profile-options.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix nullable avatar map entry
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          old = "        if (avatarUrl case final url?) 'avatar_url': url,"
          new = "        'avatar_url': avatarUrl,"
          if old not in s:
              raise SystemExit('Expected avatar map line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "fix: use nullable avatar map value" || true
          git push
