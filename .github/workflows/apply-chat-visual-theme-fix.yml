name: Apply chat visual and theme fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Apply targeted patch
        run: python tools/apply_chat_visual_and_theme_fix.py
      - name: Verify source
        run: |
          grep -q "appTheme.addListener(_onAppThemeChanged)" lib/main.dart
          grep -q "Color(appTheme.backgroundSeed)" lib/main.dart
          grep -q "themeMode: appTheme.dark ? ThemeMode.dark : ThemeMode.light" lib/main.dart
          grep -q "darkTheme: ThemeData" lib/main.dart
          grep -q "0xFF20242B" lib/chat_background_page.dart
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/chat_background_page.dart tools/apply_chat_visual_and_theme_fix.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: wire chat background and dark mode"
          git push origin HEAD:main
