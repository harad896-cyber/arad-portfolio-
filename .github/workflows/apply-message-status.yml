name: Apply real message status

on:
  push:
    paths:
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          old = """  Future<void> markRead() async {
    try {
      final rows = await supabase.from('messages').select('id').eq('conversation_id', widget.id).neq('sender_id', supabase.auth.currentUser!.id);
      for (final row in rows) {
        await supabase.rpc('mark_message_read', params: {'p_message_id': row['id']});
      }
    } catch (_) {}
  }
"""
          new = """  Future<void> markRead() async {
    final uid = supabase.auth.currentUser?.id;
    if (uid == null) return;
    try {
      final rows = await supabase.from('messages').select('id').eq('conversation_id', widget.id).neq('sender_id', uid);
      for (final row in rows) {
        final now = DateTime.now().toUtc().toIso8601String();
        await supabase.from('message_reads').upsert({'message_id': row['id'], 'user_id': uid, 'read_at': now}, onConflict: 'message_id,user_id');
        await supabase.from('messages').update({'read_at': now}).eq('id', row['id']).neq('sender_id', uid);
      }
    } catch (_) {}
  }

  Future<void> markDeliveredForIncoming() async {
    final uid = supabase.auth.currentUser?.id;
    if (uid == null) return;
    try {
      final rows = await supabase.from('messages').select('id,delivered_at').eq('conversation_id', widget.id).neq('sender_id', uid);
      for (final row in rows) {
        if (row['delivered_at'] == null) {
          await supabase.from('messages').update({'delivered_at': DateTime.now().toUtc().toIso8601String()}).eq('id', row['id']).neq('sender_id', uid);
        }
      }
    } catch (_) {}
  }
"""
          if old not in s: raise SystemExit('markRead not found')
          s = s.replace(old, new, 1)
          old = "      await markRead();\n    } catch (e) {"
          if old not in s: raise SystemExit('load hook not found')
          s = s.replace(old, "      await markDeliveredForIncoming();\n      await markRead();\n    } catch (e) {", 1)
          old = "                          Icon(m['read_at'] != null ? Icons.done_all_rounded : Icons.done_rounded, size: 15, color: m['read_at'] != null ? const Color(0xFF62B7FF) : textColor.withValues(alpha: .7)),\n"
          new = """                          Icon(
                            m['read_at'] != null ? Icons.done_all_rounded : m['delivered_at'] != null ? Icons.done_all_rounded : Icons.done_rounded,
                            size: 15,
                            color: m['read_at'] != null ? const Color(0xFF62B7FF) : textColor.withValues(alpha: .7),
                          ),
"""
          if old not in s: raise SystemExit('tick not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'feat: real message delivery and read status'
          git push
