name: Group Links and Channel Management APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Apply reference group UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('lib/main.dart')
          s = main.read_text(encoding='utf-8')
          if "import 'channel_management.dart';" not in s:
              s = s.replace("import 'group_management.dart';", "import 'group_management.dart';\nimport 'channel_management.dart';", 1)
          if 'ChannelManagementPage(conversationId: widget.id' not in s:
              pattern = r"(if \(_chatType == 'group'\) \{\s*Navigator\.push\(context, MaterialPageRoute\(builder: \(_\) => GroupProfilePage\(conversationId: widget\.id, title: widget\.title\)\)\);\s*\})"
              s = re.sub(pattern, r"\1 else if (_chatType == 'channel') {\n              Navigator.push(context, MaterialPageRoute(builder: (_) => ChannelManagementPage(conversationId: widget.id, title: widget.title)));\n            }", s, count=1)
          main.write_text(s, encoding='utf-8')

          gp = Path('lib/group_management.dart')
          g = gp.read_text(encoding='utf-8')
          if "import 'channel_management.dart';" not in g:
              g = g.replace("import 'group_moderation.dart';", "import 'group_moderation.dart';\nimport 'channel_management.dart';", 1)

          start = g.find('  @override Widget build(BuildContext context) {')
          end = g.find('\n  }\n}\n\nclass GroupManagementPage', start)
          if start >= 0 and end > start:
              new_build = r'''  Widget _refRow({required IconData icon, required String title, String? subtitle, String? trailing, VoidCallback? onTap, Widget? trailingWidget, bool danger = false}) {
    final scheme = Theme.of(context).colorScheme;
    return InkWell(onTap: onTap, child: Padding(padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 14), child: Row(children: [
      Icon(icon, size: 29, color: danger ? scheme.error : scheme.onSurface.withValues(alpha: .55)),
      const SizedBox(width: 18),
      Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.end, children: [
        Text(title, textAlign: TextAlign.right, style: TextStyle(fontSize: 18, fontWeight: FontWeight.w600, color: danger ? scheme.error : scheme.onSurface)),
        if (subtitle != null) ...[const SizedBox(height: 3), Text(subtitle, textAlign: TextAlign.right, maxLines: 2, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 13, color: scheme.onSurface.withValues(alpha: .45)))],
      ])),
      if (trailingWidget != null) ...[const SizedBox(width: 12), trailingWidget],
      if (trailing != null) ...[const SizedBox(width: 12), Text(trailing, style: TextStyle(fontSize: 14, color: scheme.primary, fontWeight: FontWeight.w600))],
    ])));
  }

  Widget _refSection({required List<Widget> children}) {
    final scheme = Theme.of(context).colorScheme;
    return Container(margin: const EdgeInsets.only(top: 12), decoration: BoxDecoration(color: scheme.surface.withValues(alpha: .78)), child: Column(children: children));
  }

  @override Widget build(BuildContext context) {
    if (loading) return Scaffold(appBar: AppBar(title: const Text('ویرایش')), body: const Center(child: CircularProgressIndicator()));
    final g = group!;
    final title = (g['title'] ?? widget.title).toString();
    final desc = (g['description'] ?? '').toString().trim();
    final image = (g['avatar_url'] ?? '').toString();
    final scheme = Theme.of(context).colorScheme;
    final dark = Theme.of(context).brightness == Brightness.dark;
    return Scaffold(
      backgroundColor: dark ? const Color(0xFF151515) : const Color(0xFFF2F3F5),
      appBar: AppBar(elevation: 0, backgroundColor: dark ? const Color(0xFF242424) : Colors.white, title: const Text('ویرایش', style: TextStyle(fontWeight: FontWeight.w700)), leading: IconButton(onPressed: () => Navigator.pop(context), icon: const Icon(Icons.arrow_back_rounded)), actions: [IconButton(onPressed: admin ? editInfo : null, tooltip: 'ذخیره', icon: const Icon(Icons.check_rounded, size: 31))]),
      body: ListView(children: [
        Container(color: dark ? const Color(0xFF191919) : Colors.white, padding: const EdgeInsets.fromLTRB(22, 24, 22, 20), child: Column(children: [
          CircleAvatar(radius: 58, backgroundImage: image.isNotEmpty ? NetworkImage(image) : null, child: image.isEmpty ? const Icon(Icons.groups_rounded, size: 54) : null),
          const SizedBox(height: 14),
          InkWell(onTap: admin ? editInfo : null, child: Row(mainAxisAlignment: MainAxisAlignment.center, children: [Flexible(child: Text(title, style: const TextStyle(fontSize: 24, fontWeight: FontWeight.w700), textAlign: TextAlign.center)), if (admin) ...[const SizedBox(width: 6), Icon(Icons.edit_rounded, size: 18, color: scheme.primary)]])),
          if ((g['username'] ?? '').toString().trim().isNotEmpty) ...[const SizedBox(height: 3), Text('@${g['username']}', style: TextStyle(color: scheme.primary, fontSize: 14, fontWeight: FontWeight.w600))],
          const SizedBox(height: 7),
          Text('${members.length} عضو${desc.isEmpty ? '' : '  •  $desc'}', maxLines: 2, overflow: TextOverflow.ellipsis, textAlign: TextAlign.center, style: TextStyle(color: scheme.onSurface.withValues(alpha: .48), fontSize: 13)),
          const SizedBox(height: 18),
          if (admin) TextButton.icon(onPressed: editInfo, icon: Icon(Icons.photo_camera_outlined, color: scheme.primary, size: 27), label: Text('تنظیم تصویر جدید', style: TextStyle(fontSize: 17, color: scheme.primary, fontWeight: FontWeight.w600))),
        ])),
        if (admin) _refSection(children: [
          _refRow(icon: Icons.link_rounded, title: 'مدیریت لینک دعوت', subtitle: 'ایجاد یا تغییر لینک', onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => ConversationInvitePage(conversationId: widget.conversationId, title: title, type: 'group')))),
        ]),
        _refSection(children: [
          _refRow(icon: Icons.chat_bubble_outline_rounded, title: 'تاریخچه گفتگو برای اعضای جدید', subtitle: 'پنهان', trailingWidget: const Switch(value: false, onChanged: null)),
          _refRow(icon: Icons.notifications_none_rounded, title: 'پیام‌های شنیده‌ای در گروه ارسال شوند؟', trailingWidget: Switch(value: g['allow_reactions'] != false, onChanged: admin ? (v) => updateSettings(reactions: v) : null)),
        ]),
        _refSection(children: [
          _refRow(icon: Icons.favorite_border_rounded, title: 'واکنش‌ها', trailing: g['allow_reactions'] == false ? 'خاموش' : 'همه', onTap: admin ? () => updateSettings(reactions: g['allow_reactions'] != true) : null),
          _refRow(icon: Icons.key_outlined, title: 'اختیارات', subtitle: admin ? 'نقش‌ها و دسترسی اعضا' : 'فقط مدیران', onTap: admin ? openManagement : null),
          _refRow(icon: Icons.person_off_outlined, title: 'کاربران حذف شده', subtitle: 'مدیریت کاربران اخراج‌شده', onTap: admin ? () => Navigator.push(context, MaterialPageRoute(builder: (_) => GroupModerationPage(conversationId: widget.conversationId, title: title))) : null),
          _refRow(icon: Icons.shield_outlined, title: 'مدیران', trailing: members.where((m) => ['admin','owner'].contains(m['role'])).length.toString(), onTap: admin ? openManagement : null),
          _refRow(icon: Icons.people_outline_rounded, title: 'اعضا', trailing: members.length.toString(), onTap: () => showModalBottomSheet<void>(context: context, showDragHandle: true, builder: (_) => ListView(padding: const EdgeInsets.all(16), children: [const Text('اعضای گروه', style: TextStyle(fontSize: 20, fontWeight: FontWeight.w800)), const SizedBox(height: 8), ...members.map((m) { final id = m['user_id'].toString(); final a = avatarOf(id); return ListTile(leading: CircleAvatar(backgroundImage: a.isNotEmpty ? NetworkImage(a) : null, child: a.isEmpty ? const Icon(Icons.person) : null), title: Text(nameOf(id)), subtitle: Text((m['role'] ?? 'member').toString())); })]))),
        ]),
        _refSection(children: [
          _refRow(icon: Icons.logout_rounded, title: owner ? 'حذف گروه' : 'خروج از گروه', subtitle: owner ? 'این گروه برای همه حذف می‌شود' : 'فقط حساب شما خارج می‌شود', danger: true, onTap: owner ? deleteGroup : leaveGroup),
        ]),
        if (busy) const Padding(padding: EdgeInsets.all(18), child: Center(child: CircularProgressIndicator())),
        const SizedBox(height: 20),
      ]),
    );
  }'''
              g = g[:start] + new_build + g[end+4:]
          gp.write_text(g, encoding='utf-8')

          cp = Path('lib/channel_management.dart')
          c = cp.read_text(encoding='utf-8')
          if 'bool canManage=false;' not in c:
              c = c.replace("final db=Supabase.instance.client; Map<String,dynamic>? c; bool loading=true,busy=false;", "final db=Supabase.instance.client; Map<String,dynamic>? c; bool loading=true,busy=false,canManage=false;")
          if "final m=await db.from('conversation_members').select('role')" not in c:
              c = c.replace("final r=await db.from('conversations').select('id,type,title,description,avatar_url,created_by,username,is_public,join_approval,only_admins_can_post,only_admins_can_add,allow_reactions,auto_delete_seconds').eq('id',widget.conversationId).single();", "final r=await db.from('conversations').select('id,type,title,description,avatar_url,created_by,username,is_public,join_approval,only_admins_can_post,only_admins_can_add,allow_reactions,auto_delete_seconds').eq('id',widget.conversationId).single(); final uid=db.auth.currentUser?.id; final m=uid==null?null:await db.from('conversation_members').select('role').eq('conversation_id',widget.conversationId).eq('user_id',uid).maybeSingle(); final memberAdmin=m?['role']=='admin'||m?['role']=='owner';")
              c = c.replace("if(mounted)setState(()=>c=Map<String,dynamic>.from(r)..['loading']=false);", "if(mounted)setState((){c=Map<String,dynamic>.from(r)..['loading']=false;canManage=owner||memberAdmin==true;});")
          c = c.replace("if(!owner||c==null||busy)return;", "if(!canManage||c==null||busy)return;")
          c = c.replace("if(!owner||c==null)return;", "if(!canManage||c==null)return;")
          c = c.replace("onTap:owner?edit:null", "onTap:canManage?edit:null")
          c = c.replace("onChanged:owner?", "onChanged:canManage?")
          cp.write_text(c, encoding='utf-8')
          PY
      - name: Commit source
        shell: bash
        run: |
          if git diff --quiet; then echo 'No source changes needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart lib/group_management.dart lib/channel_management.dart
          git commit -m 'feat: redesign group profile from reference'
          git push
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Regenerate Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --platforms=android --org com.arad.messenger --project-name arad_messenger .
          test -f android/gradlew
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              p.write_text(p.read_text(encoding='utf-8').replace('minSdk = flutter.minSdkVersion', 'minSdk = 24'), encoding='utf-8')
          else:
              p = Path('android/app/build.gradle')
              p.write_text(p.read_text(encoding='utf-8').replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24'), encoding='utf-8')
          PY
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -size +1c | head -n 1)"
          test -n "$APK"
          mkdir -p ../build/app/outputs/flutter-apk
          cp "$APK" ../build/app/outputs/flutter-apk/app-release.apk
          test -s ../build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messenger-reference-group-ui
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
