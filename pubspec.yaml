name: arad_messenger
description: A secure real-time messenger built with Flutter and Supabase.
publish_to: 'none'
version: 1.0.7+23

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  app_links: ^6.4.1
  android_id: ^0.4.0
  device_info_plus: ^12.3.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.3.2
  cupertino_icons: ^1.0.8
  cross_file: 0.3.5+2
  connectivity_plus: ^6.1.5
  cryptography: ^2.9.0
  supabase_flutter: ^2.17.2
  flutter_webrtc: ^1.6.2+hotfix.3
  image_picker: ^1.2.0
  record: ^6.1.1
  audioplayers: ^6.5.0
  file_picker: ^10.3.3
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
  video_player: ^2.10.1
  local_auth: ^2.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon.jpg
  web:
    generate: true
    image_path: assets/app_icon.jpg
    background_color: "#FFFFFF"
    theme_color: "#00A651"
