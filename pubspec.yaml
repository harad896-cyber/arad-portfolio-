name: arad_messenger
description: A secure real-time messenger built with Flutter and Supabase.
publish_to: 'none'
version: 1.0.1+14

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  image_picker: ^1.2.0
  record: ^6.1.1
  audioplayers: ^6.5.0
  file_picker: ^10.3.3
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
